---
layout: default
nav: writing
---
<article class="article-shell shell">
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y년 %m월 %d일' }}</time>
      <span aria-hidden="true">/</span>
      <span>{{ page.category | default: '기록' }}</span>
    </div>
    {% if page.description %}<p class="article-lead">{{ page.description }}</p>{% endif %}
  </header>
  {% if page.image %}
  <img class="article-cover" src="{{ page.image | relative_url }}" alt="{{ page.title }} 대표 이미지">
  {% endif %}
  <div class="prose article-body">
    {{ content }}
  </div>
  <footer class="article-footer">
    <a href="{{ '/#writing' | relative_url }}">← 모든 글 보기</a>
  </footer>
</article>
