<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    {% seo %}
    {% feed_meta %}
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=5' | relative_url }}" />
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    {% unless page.hide_header %}{% include header.html %}{% endunless %}
    <main id="main"{% if page.main_class %} class="{{ page.main_class }}"{% endif %}>
      {{ content }}
    </main>
    {% unless page.hide_footer %}{% include footer.html %}{% endunless %}
    {% if site.goatcounter.size > 0 %}
    <script
      data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    {% endif %}
  </body>
</html>
