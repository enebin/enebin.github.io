<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="컨텍스트 오염, 주의 분산, 혼동, 충돌 네 가지 실패 유형을 무엇이 들어왔는지와 모델이 어떻게 흔들리는지로 나눠 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="100" y="60" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">긴 컨텍스트가 만든 네 가지 실패 유형</text>

  <!-- 1. poisoning -->
  <rect x="100" y="90" width="480" height="250" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="130" y="135" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">들어온 것 · 환각이나 틀린 사실</text>
  <text class="t" x="130" y="180" font-size="30" font-weight="700" fill="#191919">오염 poisoning</text>
  <text class="t" x="130" y="220" font-size="18" fill="#191919">할 일 목록에 박혀 모델이 거기서 벗어나지 못한다</text>
  <text class="t" x="130" y="252" font-size="17" fill="#6d6d6d">예: 포켓몬 레드를 하면서 파이어레드의 아이스티를</text>
  <text class="t" x="130" y="278" font-size="17" fill="#6d6d6d">몇 시간이고 찾아다닌 Gemini 2.5</text>

  <!-- 2. distraction -->
  <rect x="620" y="90" width="480" height="250" fill="#fafafa"/>
  <text class="t" x="650" y="135" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">들어온 것 · 너무 길어진 이력</text>
  <text class="t" x="650" y="180" font-size="30" font-weight="700" fill="#191919">주의 분산 distraction</text>
  <text class="t" x="650" y="220" font-size="18" fill="#191919">학습 지식보다 컨텍스트에 적힌 쪽을 따라 한다</text>
  <text class="t" x="650" y="252" font-size="17" fill="#6d6d6d">예: 10만 토큰을 크게 넘자 새 계획 대신</text>
  <text class="t" x="650" y="278" font-size="17" fill="#6d6d6d">이력에 있던 행동을 반복</text>

  <!-- 3. confusion -->
  <rect x="100" y="380" width="480" height="250" fill="#fafafa"/>
  <text class="t" x="130" y="425" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">들어온 것 · 문제와 상관없는 정보</text>
  <text class="t" x="130" y="470" font-size="30" font-weight="700" fill="#191919">혼동 confusion</text>
  <text class="t" x="130" y="510" font-size="18" fill="#191919">답이 알 수 없는 방향으로 휜다</text>
  <text class="t" x="130" y="542" font-size="17" fill="#6d6d6d">예: 회사 일과 가족 프로젝트를 한데 섞어</text>
  <text class="t" x="130" y="568" font-size="17" fill="#6d6d6d">메모하는 채팅의 기억 기능</text>

  <!-- 4. clash -->
  <rect x="620" y="380" width="480" height="250" fill="#fafafa"/>
  <text class="t" x="650" y="425" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">들어온 것 · 서로 어긋나는 도구와 스킬</text>
  <text class="t" x="650" y="470" font-size="30" font-weight="700" fill="#191919">충돌 clash</text>
  <text class="t" x="650" y="510" font-size="18" fill="#191919">하네스 안의 정보가 서로 발목을 잡는다</text>
  <text class="t" x="650" y="542" font-size="17" fill="#6d6d6d">예: 시작할 때마다 스킬 600개를 불러오던</text>
  <text class="t" x="650" y="568" font-size="17" fill="#6d6d6d">어느 기업의 에이전트</text>

  <text class="t" x="1100" y="672" text-anchor="end" font-size="17" fill="#6d6d6d">컨텍스트가 커질수록 틀린 것이 들어갈 자리도 커진다</text>
</svg>
