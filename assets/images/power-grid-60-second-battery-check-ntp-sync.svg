<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="NTP 시계 동기화를 껐을 때와 켰을 때 UPS 자체 진단 시점이 움직이는 차이와 매분 0초 고정 실행을 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="78" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">CLOCK SYNCHRONIZATION × EMS</text>
  <text class="t" x="90" y="122" font-size="30" font-weight="700" fill="#191919">NTP 시간 동기화와 제조사 타이머 구현이 만드는 동시 실행</text>

  <!-- Row 1: Building 1 & 4 -->
  <rect x="90" y="160" width="1020" height="145" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="125" y="200" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">건물 1·4 UPS (제조사 A) · 매분 시작 시점 고정</text>
  <text class="t" x="125" y="242" font-size="28" font-weight="700" fill="#191919">매분 00초 직후 전력 수요 피크 발생</text>
  <text class="t" x="125" y="278" font-size="18" fill="#6d6d6d">표준시에 맞춘 시계가 다음 분이 시작될 때마다 동시에 진단을 깨워 수개월간 위상이 고정된다</text>
  <path d="M760 265 L810 265 L818 195 L828 265 L910 265 L918 195 L928 265 L1010 265 L1018 195 L1028 265 L1075 265" fill="none" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="818" y="290" text-anchor="middle" font-size="15" fill="#e34f32">:00</text>
  <text class="t" x="918" y="290" text-anchor="middle" font-size="15" fill="#e34f32">:00</text>
  <text class="t" x="1018" y="290" text-anchor="middle" font-size="15" fill="#e34f32">:00</text>

  <!-- Row 2: Building 3 NTP ON -->
  <rect x="90" y="330" width="1020" height="145" fill="#fafafa" stroke="#191919" stroke-width="2"/>
  <text class="t" x="125" y="370" font-size="15" font-weight="700" letter-spacing="2" fill="#191919">건물 3 UPS (제조사 B) · NTP 활성화 시</text>
  <text class="t" x="125" y="412" font-size="28" font-weight="700" fill="#191919">낮 동안 유지되다 매일 00:00 UTC 자정에 강제 재설정</text>
  <text class="t" x="125" y="448" font-size="18" fill="#6d6d6d">내부 1분 타이머로 돌다가 자정마다 외부 표준시(NTP)가 시점을 하루 약 6초씩 불연속으로 당겨 맞춘다</text>
  <path d="M760 440 L830 440 L830 415 L910 415 L910 390 L990 390 L990 365 L1075 365" fill="none" stroke="#191919" stroke-width="2"/>
  <text class="t" x="915" y="458" text-anchor="middle" font-size="15" fill="#6d6d6d">00:00 UTC 재설정 계단</text>

  <!-- Row 3: Building 3 NTP OFF -->
  <rect x="90" y="500" width="1020" height="135" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="125" y="540" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">건물 3 UPS (제조사 B) · NTP 비활성화 시</text>
  <text class="t" x="125" y="582" font-size="28" font-weight="700" fill="#6d6d6d">자체 시계 오차에 따라 진단 시점이 서서히 표류</text>
  <text class="t" x="125" y="615" font-size="18" fill="#6d6d6d">외부 시계 동기화가 없으면 기기마다 다른 속도로 밀려 자연스러운 분산(지터) 효과가 생긴다</text>
  <path d="M760 555 L1075 605" fill="none" stroke="#6d6d6d" stroke-width="2" stroke-dasharray="6,6"/>

  <text class="t" x="1110" y="668" text-anchor="end" font-size="17" fill="#6d6d6d">어설프게 정확한 시계 동기화가 전 세계 기기들의 점검 시각을 한 점으로 모았다</text>
</svg>
