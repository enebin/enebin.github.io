<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="tar-framing과 tar-codec, archive-trait으로 이어지는 3단계 계층 구조와 cap-std 기반 디렉터리 고정 추출의 성능을 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="64" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">점진적으로 제약을 조이는 3계층 설계와 디스크 추출의 보안-성능 균형</text>

  <!-- Left column: 3 Layers -->
  <rect x="90" y="100" width="580" height="150" fill="#fafafa"/>
  <text class="t" x="120" y="138" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">1계층 · TAR-FRAMING (물리 API + 논리 API)</text>
  <text class="t" x="120" y="176" font-size="28" font-weight="700" fill="#191919">512B 블록 상태 머신과 멤버 조립</text>
  <text class="t" x="120" y="208" font-size="16" fill="#6d6d6d">물리 API가 블록 단위 상태 전이를 검증하고, 논리 API가 pax size 같은</text>
  <text class="t" x="120" y="232" font-size="16" fill="#6d6d6d">프레이밍 확장을 병합해 완결된 아카이브 멤버 스트림으로 변환함</text>

  <path d="M380 254 L380 284" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M372 276 L380 286 L388 276" fill="none" stroke="#c9c9c9" stroke-width="2"/>

  <rect x="90" y="290" width="580" height="145" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="120" y="328" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">2계층 · TAR-CODEC (파서 · 인코더)</text>
  <text class="t" x="120" y="366" font-size="28" font-weight="700" fill="#191919">메모리 및 디스크 추출 · 체크섬 최적화</text>
  <text class="t" x="120" y="398" font-size="16" fill="#191919">체크섬·pax 길이 접두사 계산을 최적화하고 버퍼를 재사용해</text>
  <text class="t" x="120" y="422" font-size="16" fill="#191919">기존 astral-tokio-tar(702.8ms) 대비 2배 빠른 329.4ms 달성</text>

  <path d="M380 439 L380 469" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M372 461 L380 471 L388 461" fill="none" stroke="#c9c9c9" stroke-width="2"/>

  <rect x="90" y="475" width="580" height="145" fill="#fafafa"/>
  <text class="t" x="120" y="513" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">3계층 · ARCHIVE-TRAIT + CAP-STD</text>
  <text class="t" x="120" y="551" font-size="28" font-weight="700" fill="#191919">디렉터리 권한 고정(Capability) 추출</text>
  <text class="t" x="120" y="583" font-size="16" fill="#6d6d6d">추출 대상 폴더를 cap-std 루트로 고정해 상대 경로(../)나</text>
  <text class="t" x="120" y="607" font-size="16" fill="#6d6d6d">심볼릭·하드링크를 통한 상위 디렉터리 탈출을 차단함</text>

  <!-- Right column: Benchmark & OS syscall tradeoff -->
  <rect x="700" y="100" width="410" height="240" fill="#fafafa"/>
  <text class="t" x="730" y="138" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">UV 벤치마크 · 파싱 소요 시간</text>
  <text class="t" x="730" y="176" font-size="28" font-weight="700" fill="#191919">약 2.1배 속도 향상</text>

  <text class="t" x="730" y="216" font-size="16" font-weight="700" fill="#6d6d6d">astral-tokio-tar (기존)</text>
  <rect x="730" y="226" width="340" height="28" fill="#c9c9c9"/>
  <text class="t" x="1060" y="246" text-anchor="end" font-size="15" font-weight="700" fill="#191919">702.8 ms</text>

  <text class="t" x="730" y="282" font-size="16" font-weight="700" fill="#e34f32">tar-codec (uv 0.13 기본값)</text>
  <rect x="730" y="292" width="160" height="28" fill="#e34f32"/>
  <text class="t" x="902" y="312" font-size="15" font-weight="700" fill="#e34f32">329.4 ms</text>

  <rect x="700" y="365" width="410" height="255" fill="#fafafa"/>
  <text class="t" x="730" y="403" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">운영체제별 디스크 추출 비용</text>
  <text class="t" x="730" y="441" font-size="26" font-weight="700" fill="#191919">보안 검증과 시스템 콜의 교환</text>
  <line x1="730" y1="460" x2="1080" y2="460" stroke="#e9e9e9" stroke-width="1"/>

  <text class="t" x="730" y="492" font-size="17" font-weight="700" fill="#191919">Linux · openat2(RESOLVE_BENEATH)</text>
  <text class="t" x="730" y="518" font-size="15" fill="#6d6d6d">커널이 루트 탈출을 한 번에 검사해 빠름</text>

  <text class="t" x="730" y="558" font-size="17" font-weight="700" fill="#191919">macOS 등 · 경로 단계별 디렉터리 열기</text>
  <text class="t" x="730" y="584" font-size="15" fill="#6d6d6d">openat2가 없어 경로 깊이(a/b/c)에 비례해</text>
  <text class="t" x="730" y="606" font-size="15" fill="#6d6d6d">핸들을 하나씩 열며 검증하느라 오버헤드 발생</text>

  <text class="t" x="1110" y="664" text-anchor="end" font-size="17" fill="#6d6d6d">파싱은 최대한 엄격하고 빠르게 처리하되 디스크에 쓸 때는 경로 탈출 방지를 위해 시스템 콜 비용을 감수한다</text>
</svg>
