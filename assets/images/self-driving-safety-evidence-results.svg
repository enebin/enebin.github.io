<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Waymo의 사고 관여율 68% 감소와 부상 사고 관여율 81% 감소">
<style>.t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text class="t" x="70" y="80" font-size="30" fill="#191919" font-weight="700">IIHS가 비교한 Waymo 무인 운행</text><text class="t" x="70" y="120" font-size="18" fill="#6d6d6d">같은 지역·기간 / 주행거리 기준 / 경찰에 신고할 만한 사고</text><rect x="70" y="180" width="510" height="330" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="100" y="245" font-size="30" fill="#191919" font-weight="700">사고 관여율</text><text class="t" x="100" y="340" font-size="30" fill="#e34f32" font-weight="700">68% 낮음</text><text class="t" x="100" y="420" font-size="19" fill="#191919">경찰에 신고할 만한 사고 전체</text><rect x="620" y="180" width="510" height="330" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="650" y="245" font-size="30" fill="#191919" font-weight="700">부상 사고 관여율</text><text class="t" x="650" y="340" font-size="30" fill="#e34f32" font-weight="700">81% 낮음</text><text class="t" x="650" y="420" font-size="19" fill="#191919">사람이 다친 사고</text><rect x="70" y="550" width="1060" height="85" fill="#ffffff" stroke="#e34f32" stroke-width="2"/><text class="t" x="100" y="602" font-size="19" fill="#191919">서로 다른 사고 범주  ·  사망률 감소를 직접 뜻하지 않는다</text><text class="t" x="70" y="675" font-size="16" fill="#6d6d6d">출처: IIHS, 2026년 7월 연구 발표</text>
</svg>