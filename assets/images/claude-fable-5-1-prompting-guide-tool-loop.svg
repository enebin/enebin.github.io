  <text class="t" x="1035" y="316" text-anchor="middle" font-size="19" font-weight="700" fill="#191919">답변</text>
  <path d="M280 305 L380 305 M570 305 L670 305 M860 305 L960 305" stroke="#e34f32" stroke-width="3"/>
  <path d="M368 297 L382 305 L368 313 M658 297 L672 305 L658 313 M948 297 L962 305 L948 313" fill="none" stroke="#e34f32" stroke-width="3"/>
