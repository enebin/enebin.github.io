<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="문장을 눈으로 읽으면 지식이 전해진다는 전달주의 매체에서 읽는 행동이 곧 이해하는 활동이 되는 인지 매체로 전환한다는 표지 그림">
  <style>
