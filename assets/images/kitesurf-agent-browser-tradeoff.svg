<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="스크린숏 작업에서 Kitesurf가 Chromium보다 CPU와 메모리는 적게 쓰지만 완료 시간은 더 긴 것을 보여주는 막대 비교 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="76" y="70" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">RESOURCE VS LATENCY</text>
  <text class="t" x="76" y="118" font-size="30" font-weight="700" fill="#191919">두 줄은 이기고 한 줄은 진다</text>

  <rect x="76" y="150" width="18" height="18" fill="#e34f32"/>
  <text class="t" x="104" y="166" font-size="17" font-weight="700" fill="#191919">Kitesurf</text>
  <rect x="210" y="150" width="18" height="18" fill="#e9e9e9"/>
  <text class="t" x="238" y="166" font-size="17" fill="#6d6d6d">Chromium</text>
  <text class="t" x="1124" y="166" text-anchor="end" font-size="16" fill="#6d6d6d">스크린숏 작업 · 짧을수록 좋음</text>

  <text class="t" x="76" y="276" font-size="18" font-weight="700" fill="#191919">CPU</text>
  <rect x="250" y="228" width="194" height="34" fill="#e34f32"/>
  <text class="t" x="458" y="252" font-size="17" font-weight="700" fill="#e34f32">380ms</text>
  <rect x="250" y="270" width="600" height="34" fill="#e9e9e9"/>
  <text class="t" x="864" y="294" font-size="17" fill="#6d6d6d">1,173ms</text>

  <text class="t" x="76" y="404" font-size="18" font-weight="700" fill="#191919">메모리</text>
  <rect x="250" y="356" width="128" height="34" fill="#e34f32"/>
  <text class="t" x="392" y="380" font-size="17" font-weight="700" fill="#e34f32">57.8MiB</text>
  <rect x="250" y="398" width="600" height="34" fill="#e9e9e9"/>
  <text class="t" x="864" y="422" font-size="17" fill="#6d6d6d">271.0MiB</text>

  <line x1="76" y1="472" x2="1124" y2="472" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="76" y="558" font-size="18" font-weight="700" fill="#191919">완료 시간</text>
  <text class="t" x="76" y="584" font-size="15" font-weight="700" fill="#e34f32">여기만 뒤집힌다</text>
  <rect x="250" y="510" width="600" height="34" fill="#e34f32"/>
  <text class="t" x="864" y="534" font-size="17" font-weight="700" fill="#e34f32">1,148ms</text>
  <rect x="250" y="552" width="333" height="34" fill="#e9e9e9"/>
  <text class="t" x="597" y="576" font-size="17" fill="#6d6d6d">637ms</text>

  <text class="t" x="1124" y="646" text-anchor="end" font-size="16" fill="#6d6d6d">줄마다 눈금이 다름 · 14개 URL을 5회 실행한 중앙값</text>
</svg>
