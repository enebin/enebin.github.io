<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="빌드 시점에 초기 데이터를 실행 계획에 구워 넣어 첫 화면을 먼저 그리고 Hermes 바이트코드는 첫 픽셀 이후에 불러오는 부팅 순서와 RealWorld 웹 벤치마크 비교">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Top section: Boot pipeline -->
  <rect x="80" y="80" width="1040" height="250" fill="#fafafa"/>
  <text class="t" x="120" y="125" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">ZERO JS BEFORE FIRST PIXEL</text>
  <text class="t" x="120" y="165" font-size="30" font-weight="700" fill="#191919">첫 픽셀 전후로 나눈 부팅 경로</text>

  <rect x="120" y="195" width="280" height="100" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="145" y="232" font-size="15" font-weight="700" fill="#6d6d6d">1. 빌드 시점</text>
  <text class="t" x="145" y="262" font-size="20" font-weight="700" fill="#191919">Plan에 초기 데이터 포함</text>
  <text class="t" x="145" y="284" font-size="16" fill="#6d6d6d">TS는 Hermes 바이트코드로 변환</text>

  <path d="M400 245 L460 245" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M452 237 L462 245 L452 253" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="465" y="195" width="280" height="100" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="490" y="232" font-size="15" font-weight="700" fill="#e34f32">2. 첫 픽셀 (p50 100ms 목표)</text>
  <text class="t" x="490" y="262" font-size="20" font-weight="700" fill="#191919">앱 JS 실행 0줄</text>
  <text class="t" x="490" y="284" font-size="16" fill="#6d6d6d">구워진 Plan만으로 즉시 렌더링</text>

  <path d="M745 245 L805 245" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M797 237 L807 245 L797 253" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="810" y="195" width="270" height="100" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="835" y="232" font-size="15" font-weight="700" fill="#6d6d6d">3. 첫 프레임 이후</text>
  <text class="t" x="835" y="262" font-size="20" font-weight="700" fill="#191919">데이터·선택 모듈 로드</text>
  <text class="t" x="835" y="284" font-size="16" fill="#6d6d6d">Hermes · GPU · 에디터 온디맨드</text>

  <!-- Bottom section: Budgets & RealWorld comparison -->
  <rect x="80" y="365" width="500" height="240" fill="#fafafa"/>
  <text class="t" x="120" y="412" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">COMMIT BUDGETS (P0)</text>
  <text class="t" x="120" y="452" font-size="28" font-weight="700" fill="#191919">커밋마다 추적하는 속도 예산</text>
  <text class="t" x="120" y="495" font-size="18" fill="#191919">콜드 스타트 첫 프레임</text>
  <text class="t" x="540" y="495" text-anchor="end" font-size="18" font-weight="700" fill="#e34f32">100ms (p50)</text>
  <text class="t" x="120" y="530" font-size="18" fill="#191919">코드 수정 후 화면 반영</text>
  <text class="t" x="540" y="530" text-anchor="end" font-size="18" font-weight="700" fill="#e34f32">100ms (p50)</text>
  <text class="t" x="120" y="565" font-size="18" fill="#191919">단일 크레이트 재빌드 / 전체 검사</text>
  <text class="t" x="540" y="565" text-anchor="end" font-size="18" font-weight="700" fill="#191919">30s / 65s</text>

  <rect x="620" y="365" width="500" height="240" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="660" y="412" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">REALWORLD (CONDUIT) WEB</text>
  <text class="t" x="660" y="452" font-size="28" font-weight="700" fill="#191919">React 19 SSR 대비 웹 성능</text>
  <text class="t" x="660" y="495" font-size="18" fill="#191919">인터랙티브 준비 시점</text>
  <text class="t" x="1080" y="495" text-anchor="end" font-size="18" font-weight="700" fill="#e34f32">약 300ms 빠름</text>
  <text class="t" x="660" y="530" font-size="18" fill="#191919">전송 코드 크기 (Exact vs React)</text>
  <text class="t" x="1080" y="530" text-anchor="end" font-size="18" font-weight="700" fill="#191919">26KB vs 81KB</text>
  <text class="t" x="660" y="565" font-size="17" fill="#6d6d6d">서버 렌더링 결과를 재실행 없이 즉시 입양(adopt)</text>

  <text class="t" x="1120" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">예산을 어기는 커밋은 P0 장애로 분류해 개발 루프의 속도를 강제한다</text>
</svg>
