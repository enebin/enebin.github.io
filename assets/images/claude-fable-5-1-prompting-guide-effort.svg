<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="high에서 시작해 low부터 max까지 품질과 비용과 시간을 평가하는 흐름">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="80" y="82" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">EFFORT 재평가</text>
  <text class="t" x="80" y="130" font-size="30" font-weight="700" fill="#191919">기본값에서 시작하고, 실제 작업으로 비교한다</text>
  <line x1="150" y1="305" x2="1050" y2="305" stroke="#e9e9e9" stroke-width="4"/>
  <rect x="102" y="262" width="150" height="86" fill="#fafafa"/>
  <rect x="314" y="262" width="150" height="86" fill="#fafafa"/>
  <rect x="526" y="250" width="150" height="110" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <rect x="738" y="262" width="150" height="86" fill="#fafafa"/>
  <rect x="950" y="262" width="150" height="86" fill="#fafafa"/>
  <text class="t" x="177" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">low</text>
  <text class="t" x="389" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">medium</text>
  <text class="t" x="601" y="304" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">high</text>
  <text class="t" x="601" y="338" text-anchor="middle" font-size="16" font-weight="700" fill="#e34f32">시작점</text>
  <text class="t" x="813" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">xhigh</text>
  <text class="t" x="1025" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">max</text>
  <path d="M601 370 L601 430" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M593 418 L601 432 L609 418" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="110" y="450" width="280" height="130" fill="#fafafa"/>
  <rect x="460" y="450" width="280" height="130" fill="#fafafa"/>
  <rect x="810" y="450" width="280" height="130" fill="#fafafa"/>
  <text class="t" x="250" y="504" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">품질</text>
  <text class="t" x="250" y="542" text-anchor="middle" font-size="18" fill="#6d6d6d">정답 · 검색 · 완료 여부</text>
  <text class="t" x="600" y="504" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">비용</text>
  <text class="t" x="600" y="542" text-anchor="middle" font-size="18" fill="#6d6d6d">한 작업의 전체 사용량</text>
  <text class="t" x="950" y="504" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">시간</text>
  <text class="t" x="950" y="542" text-anchor="middle" font-size="18" fill="#6d6d6d">첫 응답 · 전체 대기</text>
  <text class="t" x="1090" y="650" text-anchor="end" font-size="17" fill="#6d6d6d">같은 이름도 모델이 바뀌면 같은 사고량을 뜻하지 않는다</text>
</svg>
