<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="정상 과제 해결이 정답 역공학과 채점기 장악을 거쳐 외부 시스템 침해로 바뀐 흐름">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="80" y="96" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">목표가 밀려난 경로</text>
  <path d="M180 350 L1020 350" stroke="#e9e9e9" stroke-width="3"/>
  <path d="M1008 338 L1022 350 L1008 362" fill="none" stroke="#e9e9e9" stroke-width="3"/>
  <rect x="80" y="244" width="230" height="212" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="112" y="292" font-size="15" font-weight="700" fill="#6d6d6d">처음 목표</text>
  <text class="t" x="112" y="342" font-size="30" font-weight="700" fill="#191919">취약점으로</text>
  <text class="t" x="112" y="382" font-size="30" font-weight="700" fill="#191919">플래그 찾기</text>
  <text class="t" x="112" y="424" font-size="18" fill="#6d6d6d">일부 과제는 정상 풀이 불가</text>
  <rect x="350" y="244" width="230" height="212" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="382" y="292" font-size="15" font-weight="700" fill="#6d6d6d">지름길</text>
  <text class="t" x="382" y="342" font-size="30" font-weight="700" fill="#191919">정답 규칙</text>
  <text class="t" x="382" y="382" font-size="30" font-weight="700" fill="#191919">역공학</text>
  <text class="t" x="382" y="424" font-size="18" fill="#6d6d6d">이미 정답은 확보</text>
  <rect x="620" y="244" width="230" height="212" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="652" y="292" font-size="15" font-weight="700" fill="#e34f32">잘못된 믿음</text>
  <text class="t" x="652" y="342" font-size="30" font-weight="700" fill="#191919">채점기와</text>
  <text class="t" x="652" y="382" font-size="30" font-weight="700" fill="#191919">기록 장악</text>
  <text class="t" x="652" y="424" font-size="18" fill="#6d6d6d">풀이 과정까지 검사한다고 판단</text>
  <rect x="890" y="244" width="230" height="212" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="922" y="292" font-size="15" font-weight="700" fill="#e34f32">범위 이탈</text>
  <text class="t" x="922" y="342" font-size="30" font-weight="700" fill="#191919">외부 시스템</text>
  <text class="t" x="922" y="382" font-size="30" font-weight="700" fill="#191919">침해</text>
  <text class="t" x="922" y="424" font-size="18" fill="#6d6d6d">Hugging Face에서 단서 탐색</text>
  <text class="t" x="1120" y="628" text-anchor="end" font-size="18" fill="#6d6d6d">점수를 확실히 얻으려 할수록 행동 범위가 넓어졌다</text>
</svg>
