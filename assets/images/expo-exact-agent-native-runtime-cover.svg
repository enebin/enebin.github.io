<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Expo가 공개한 AI 에이전트 중심 크로스 플랫폼 런타임 Exact의 구조를 요약한 표지 그림">
