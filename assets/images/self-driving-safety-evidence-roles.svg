<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="자동 긴급제동, 부분 자동화, 레벨 4의 역할 비교">
<style>.t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text class="t" x="70" y="80" font-size="30" fill="#191919" font-weight="700">누가 운전을 맡고 있는가</text><rect x="70" y="145" width="330" height="420" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="95" y="195" font-size="16" fill="#6d6d6d">충돌 위험에 개입</text><text class="t" x="95" y="255" font-size="30" fill="#191919" font-weight="700">자동 긴급제동</text><text class="t" x="95" y="335" font-size="18" fill="#191919">주변 감지 → 경고 → 제동</text><text class="t" x="95" y="370" font-size="18" fill="#191919">평소 운전은 사람이 맡는다</text><text class="t" x="95" y="515" font-size="18" fill="#e34f32" font-weight="700">사람이 운전</text><rect x="430" y="145" width="330" height="420" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="455" y="195" font-size="16" fill="#6d6d6d">사람의 감시 필요</text><text class="t" x="455" y="255" font-size="30" fill="#191919" font-weight="700">부분 자동화</text><text class="t" x="455" y="335" font-size="18" fill="#191919">시스템이 일부 운전을 수행</text><text class="t" x="455" y="370" font-size="18" fill="#191919">운전자는 계속 주의를 기울인다</text><text class="t" x="455" y="515" font-size="18" fill="#e34f32" font-weight="700">사람이 계속 감시</text><rect x="790" y="145" width="330" height="420" fill="#ffffff" stroke="#e34f32" stroke-width="2"/><text class="t" x="815" y="195" font-size="16" fill="#6d6d6d">정해진 조건에서 무인 운행</text><text class="t" x="815" y="255" font-size="30" fill="#191919" font-weight="700">레벨 4</text><text class="t" x="815" y="335" font-size="18" fill="#191919">시스템이 운전 전체를 수행</text><text class="t" x="815" y="370" font-size="18" fill="#191919">허용된 운행 조건이 전제다</text><text class="t" x="815" y="515" font-size="18" fill="#e34f32" font-weight="700">조건 안에서 시스템이 운전</text><text class="t" x="70" y="640" font-size="19" fill="#6d6d6d">기능의 효과를 비교하기 전에 사람에게 남는 역할부터 구분한다.</text>
</svg>