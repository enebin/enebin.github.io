<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="스무 개의 터미널 탭을 오가며 머릿속에 맥락을 담아두는 방식에서 Git 기반 우선순위 큐로 한 번에 하나씩 처리하는 방식으로 옮겨 간다는 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">AI BRAIN FRY × GIT QUEUE</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">AI 코딩 에이전트 스무 개를 띄우다</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">지친 개발자의 Git 작업 큐 실험</text>

  <rect x="90" y="340" width="440" height="170" fill="#fafafa"/>
  <text class="t" x="310" y="400" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">기존 방식</text>
  <text class="t" x="310" y="458" text-anchor="middle" font-size="30" font-weight="700" fill="#6d6d6d">탭 20개 + 머릿속 RAM</text>
  <path d="M150 448 L470 448" stroke="#6d6d6d" stroke-width="2"/>

  <path d="M530 425 L640 425" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M630 417 L640 425 L630 433" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="640" y="340" width="470" height="170" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="875" y="400" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">우선순위 큐 실험</text>
  <text class="t" x="875" y="458" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">Git 티켓 + 한 번에 하나씩</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">결정을 마친 티켓은 큐에 돌려놓아 머릿속 맥락까지 함께 닫는다</text>
</svg>
