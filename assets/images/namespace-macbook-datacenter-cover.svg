<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="데이터센터 관리용으로 설계된 Mac Mini와 달리 MacBook Pro를 서버 랙에 넣었을 때 생기는 배선과 원격 관리 문제를 대비한 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">NAMESPACE × MAC INFRASTRUCTURE</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">Namespace가 MacBook 수백 대를</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">데이터센터 랙에 꽂은 이유</text>

  <rect x="90" y="340" width="440" height="170" fill="#fafafa"/>
  <text class="t" x="310" y="400" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">기다릴 수 없던 선택지</text>
  <text class="t" x="310" y="458" text-anchor="middle" font-size="30" font-weight="700" fill="#6d6d6d">Mac Mini 6개월 대기</text>
  <path d="M160 450 L460 450" stroke="#6d6d6d" stroke-width="2"/>

  <path d="M530 425 L640 425" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M630 417 L640 425 L630 433" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="640" y="340" width="470" height="170" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="875" y="400" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">현실의 해법</text>
  <text class="t" x="875" y="458" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">MacBook 랙 + P2P 배포</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">선반당 케이블 60개 이상 · 노드당 macOS VM 2개 · 500GB 이미지 P2P 전송</text>
</svg>
