<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="글로 된 답에서 값을 바꿔 볼 수 있는 화면으로 된 답으로 옮겨 간다는 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">OPEN INTELLIGENT UI</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">답이 글이 아니라</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">화면으로 돌아올 때</text>

  <rect x="90" y="320" width="440" height="230" fill="#fafafa"/>
  <text class="t" x="120" y="365" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">글로 된 답</text>
  <path d="M120 405 L490 405" stroke="#c9c9c9" stroke-width="10"/>
  <path d="M120 435 L470 435" stroke="#c9c9c9" stroke-width="10"/>
  <path d="M120 465 L430 465" stroke="#c9c9c9" stroke-width="10"/>
  <text class="t" x="120" y="522" font-size="18" fill="#6d6d6d">"팁 20%면?" 하고 다시 묻는다</text>

  <path d="M545 435 L630 435" stroke="#6d6d6d" stroke-width="2"/><path d="M620 427 L630 435 L620 443" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="645" y="320" width="465" height="230" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="675" y="365" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">화면으로 된 답</text>
  <text class="t" x="675" y="410" font-size="17" fill="#6d6d6d">팁</text>
  <path d="M730 404 L1060 404" stroke="#e9e9e9" stroke-width="4"/>
  <path d="M730 404 L930 404" stroke="#e34f32" stroke-width="4"/>
  <rect x="922" y="394" width="16" height="20" fill="#e34f32"/>
  <text class="t" x="675" y="455" font-size="17" fill="#6d6d6d">인원</text>
  <path d="M730 449 L1060 449" stroke="#e9e9e9" stroke-width="4"/>
  <path d="M730 449 L860 449" stroke="#191919" stroke-width="4"/>
  <rect x="852" y="439" width="16" height="20" fill="#191919"/>
  <text class="t" x="675" y="522" font-size="18" fill="#191919">값을 끌어 바꾸면 결과가 바로 바뀐다</text>

  <text class="t" x="1110" y="630" text-anchor="end" font-size="17" fill="#6d6d6d">Answers you can interact with</text>
</svg>
