<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="정적 분석기, 퍼저, LLM 에이전트가 가설 생성과 발동 확인과 문맥 배치 중 어디까지 하는지 비교한 표">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- column headers -->
  <text class="t" x="548" y="150" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">가설 생성</text>
  <text class="t" x="764" y="150" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">발동 확인</text>
  <text class="t" x="980" y="150" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">문맥 배치</text>

  <!-- row 1: static analyzer -->
  <text class="t" x="180" y="238" font-size="30" font-weight="700" fill="#191919">정적 분석기</text>
  <text class="t" x="180" y="268" font-size="16" fill="#6d6d6d">코드를 실행하지 않고 훑는다</text>
  <rect x="450" y="180" width="196" height="130" fill="#fafafa"/>
  <text class="t" x="548" y="238" text-anchor="middle" font-size="17" fill="#191919">가능한 자리를</text>
  <text class="t" x="548" y="262" text-anchor="middle" font-size="17" fill="#191919">전부 나열한다</text>
  <rect x="666" y="180" width="196" height="130" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="764" y="252" text-anchor="middle" font-size="19" fill="#c9c9c9">—</text>
  <rect x="882" y="180" width="196" height="130" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="980" y="252" text-anchor="middle" font-size="19" fill="#c9c9c9">—</text>

  <!-- row 2: fuzzer -->
  <text class="t" x="180" y="388" font-size="30" font-weight="700" fill="#191919">퍼저</text>
  <text class="t" x="180" y="418" font-size="16" fill="#6d6d6d">무작위 입력으로 죽여본다</text>
  <rect x="450" y="330" width="196" height="130" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="548" y="402" text-anchor="middle" font-size="19" fill="#c9c9c9">—</text>
  <rect x="666" y="330" width="196" height="130" fill="#fafafa"/>
  <text class="t" x="764" y="388" text-anchor="middle" font-size="17" fill="#191919">실제로 죽는</text>
  <text class="t" x="764" y="412" text-anchor="middle" font-size="17" fill="#191919">입력을 찾는다</text>
  <rect x="882" y="330" width="196" height="130" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="980" y="402" text-anchor="middle" font-size="19" fill="#c9c9c9">—</text>

  <!-- row 3: llm agent -->
  <text class="t" x="180" y="538" font-size="30" font-weight="700" fill="#e34f32">LLM 에이전트</text>
  <rect x="180" y="548" width="64" height="3" fill="#e34f32"/>
  <text class="t" x="180" y="578" font-size="16" fill="#6d6d6d">가설을 세우고 스스로 확인한다</text>
  <rect x="450" y="480" width="196" height="130" fill="#fafafa"/>
  <text class="t" x="548" y="538" text-anchor="middle" font-size="17" fill="#191919">패턴을 일반화해</text>
  <text class="t" x="548" y="562" text-anchor="middle" font-size="17" fill="#191919">후보를 세운다</text>
  <rect x="666" y="480" width="196" height="130" fill="#fafafa"/>
  <text class="t" x="764" y="538" text-anchor="middle" font-size="17" fill="#191919">재현을 시도하고</text>
  <text class="t" x="764" y="562" text-anchor="middle" font-size="17" fill="#191919">안 되면 버린다</text>
  <rect x="882" y="480" width="196" height="130" fill="#fafafa"/>
  <text class="t" x="980" y="538" text-anchor="middle" font-size="17" fill="#191919">도달 경로와</text>
  <text class="t" x="980" y="562" text-anchor="middle" font-size="17" fill="#191919">공격 가치를 쓴다</text>

  <text class="t" x="1080" y="666" text-anchor="end" font-size="17" fill="#6d6d6d">에이전트가 새로 한 건 왼쪽 칸이 아니라 오른쪽 두 칸이다</text>
</svg>
