<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="key-amnesia가 막는 직접 노출과 막지 못하는 변형 출력 및 같은 사용자 권한 위험을 층별로 나눈 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="80" y="78" font-size="16" font-weight="700" fill="#6d6d6d">보안 경계와 남는 책임</text>

  <rect x="80" y="125" width="1040" height="130" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="120" y="172" font-size="15" font-weight="700" fill="#e34f32">도구가 직접 막는 범위</text>
  <text class="t" x="120" y="216" font-size="30" font-weight="700" fill="#191919">평문 저장 · 직접 열람 · 원문 그대로의 출력</text>
  <text class="t" x="1075" y="216" text-anchor="end" font-size="18" fill="#6d6d6d">key-amnesia</text>

  <rect x="80" y="285" width="1040" height="130" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="120" y="332" font-size="15" font-weight="700" fill="#6d6d6d">허용한 프로그램의 책임</text>
  <text class="t" x="120" y="376" font-size="30" font-weight="700" fill="#191919">변형 출력 · 외부 전송 · 잘못된 명령 실행</text>
  <text class="t" x="1075" y="376" text-anchor="end" font-size="18" fill="#6d6d6d">명령과 대상 제한</text>

  <rect x="80" y="445" width="1040" height="130" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="120" y="492" font-size="15" font-weight="700" fill="#6d6d6d">운영 환경의 책임</text>
  <text class="t" x="120" y="536" font-size="30" font-weight="700" fill="#191919">같은 사용자 프로세스 · 화면 제어 · 넓은 승인 범위</text>
  <text class="t" x="1075" y="536" text-anchor="end" font-size="18" fill="#6d6d6d">OS 권한과 승인 정책</text>

  <line x1="600" y1="590" x2="600" y2="640" stroke="#e34f32" stroke-width="3"/>
  <path d="M591 629 L600 642 L609 629" fill="none" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="625" y="623" font-size="18" font-weight="700" fill="#e34f32">아래 경계까지 자동으로 안전해지지는 않는다</text>
</svg>
