<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="기존의 gitignore 보호 범위와 AI 에이전트까지 포함한 새로운 비밀 관리 범위를 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="80" y="86" font-size="16" font-weight="700" fill="#6d6d6d">보호 경계의 변화</text>
  <line x1="600" y1="118" x2="600" y2="620" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="80" y="164" font-size="30" font-weight="700" fill="#191919">기존 위협 모델</text>
  <text class="t" x="650" y="164" font-size="30" font-weight="700" fill="#191919">에이전트가 들어온 환경</text>

  <rect x="80" y="220" width="440" height="110" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="110" y="267" font-size="19" font-weight="700" fill="#191919">.env</text>
  <text class="t" x="110" y="300" font-size="18" fill="#6d6d6d">프로젝트 폴더에 평문으로 저장</text>
  <line x1="300" y1="342" x2="300" y2="405" stroke="#e34f32" stroke-width="3"/>
  <path d="M291 394 L300 407 L309 394" fill="none" stroke="#e34f32" stroke-width="3"/>
  <rect x="80" y="420" width="440" height="110" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="110" y="467" font-size="19" font-weight="700" fill="#191919">.gitignore</text>
  <text class="t" x="110" y="500" font-size="18" fill="#6d6d6d">Git 커밋과 원격 저장소 노출 차단</text>
  <text class="t" x="80" y="585" font-size="18" font-weight="700" fill="#e34f32">Git에는 안 올라간다</text>

  <rect x="650" y="220" width="470" height="90" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="680" y="258" font-size="19" font-weight="700" fill="#191919">프로젝트 파일 · 셸 기록 · MCP 설정</text>
  <text class="t" x="680" y="288" font-size="18" fill="#6d6d6d">에이전트가 작업하려고 읽는 영역</text>
  <line x1="885" y1="322" x2="885" y2="385" stroke="#e34f32" stroke-width="3"/>
  <path d="M876 374 L885 387 L894 374" fill="none" stroke="#e34f32" stroke-width="3"/>
  <rect x="650" y="400" width="470" height="130" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="680" y="447" font-size="19" font-weight="700" fill="#191919">AI 에이전트의 입력과 로그</text>
  <text class="t" x="680" y="480" font-size="18" fill="#6d6d6d">읽은 평문 키가 다른 기록으로 복사될 수 있음</text>
  <text class="t" x="650" y="585" font-size="18" font-weight="700" fill="#e34f32">로컬에서도 읽히면 노출이다</text>
</svg>
