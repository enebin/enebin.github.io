<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="에이전트 작업 시간이 사람의 6배로 늘어나면서 세션의 80%가 사람 입력을 기다리는 병목이 생기고 메타 업무로 옮겨가는 흐름을 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">에이전트 폭증이 사람의 주의력 병목과 메타 업무로 이어지는 과정</text>

  <!-- Step 1 -->
  <rect x="90" y="100" width="1020" height="145" fill="#fafafa"/>
  <text class="t" x="130" y="145" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">1단계 · 에이전트 가동량 폭증</text>
  <text class="t" x="130" y="188" font-size="30" font-weight="700" fill="#191919">대화형 에이전트 작업 시간이 사람의 6배</text>
  <text class="t" x="130" y="222" font-size="18" fill="#6d6d6d">새 모델 출시 직후 난이도 상위 10% 작업 비중이 10%에서 13%로 증가</text>

  <path d="M600 250 L600 282" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M592 274 L600 284 L608 274" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="624" y="274" font-size="16" fill="#6d6d6d">쏟아지는 출력과 확인 요청이 사람의 화면에 몰린다</text>

  <!-- Step 2 -->
  <rect x="90" y="290" width="1020" height="155" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="130" y="335" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">2단계 · 사람의 주의력 병목</text>
  <text class="t" x="130" y="378" font-size="30" font-weight="700" fill="#191919">대화형 세션 시간의 80%가 사람 입력 대기</text>
  <text class="t" x="130" y="414" font-size="18" fill="#191919">비기술직도 에이전트 출력을 전부 읽으려면 주당 근무 시간의 절반 이상이 필요</text>

  <path d="M600 450 L600 482" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M592 474 L600 484 L608 474" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="624" y="474" font-size="16" fill="#6d6d6d">일일이 답하는 대신 에이전트를 굴리는 체계를 만든다</text>

  <!-- Step 3 -->
  <rect x="90" y="490" width="1020" height="145" fill="#fafafa"/>
  <text class="t" x="130" y="535" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">3단계 · 메타 업무로의 이동</text>
  <text class="t" x="130" y="578" font-size="30" font-weight="700" fill="#191919">메타 업무 비중 10% → 22% · 상시 지침 8,500건</text>
  <text class="t" x="130" y="612" font-size="18" fill="#6d6d6d">다중 에이전트 실행 명세 작성, 에이전트 간 교차 검토, 비서실장 에이전트와 감시 대시보드 구축</text>

  <text class="t" x="1110" y="672" text-anchor="end" font-size="17" fill="#6d6d6d">에이전트가 빨라질수록 병목은 모델의 계산 속도가 아니라 사람의 읽기와 승인에서 생긴다</text>
</svg>
