<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="고정된 PR 이벤트 픽스처로 에이전트를 실행하고 도구 호출과 부작용 차단 여부를 검사한 뒤 한 가지 레버만 수정해 성능을 끌어올리는 힐클라이밍 평가 루프를 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- step 1 -->
  <rect x="72" y="76" width="310" height="320" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="104" y="122" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">1단계 · 고정 입력</text>
  <text class="t" x="104" y="164" font-size="30" font-weight="700" fill="#191919">이벤트 재생</text>
  <line x1="104" y1="188" x2="350" y2="188" stroke="#e9e9e9" stroke-width="1.5"/>
  <text class="t" x="104" y="226" font-size="18" font-weight="700" fill="#191919">github replay &amp; fixtures</text>
  <text class="t" x="104" y="258" font-size="17" fill="#6d6d6d">실제 PR 웹훅과 diff 패치를</text>
  <text class="t" x="104" y="284" font-size="17" fill="#6d6d6d">고정된 테스트 입력으로 저장</text>
  <text class="t" x="104" y="336" font-size="16" fill="#6d6d6d">라운드 중간에 입력을 바꾸지 않는다</text>

  <!-- arrow 1 -> 2 -->
  <path d="M382 236 L440 236" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M430 228 L442 236 L430 244" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- step 2 -->
  <rect x="445" y="76" width="310" height="320" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="477" y="122" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">2단계 · 행동 계약 검사</text>
  <text class="t" x="477" y="164" font-size="30" font-weight="700" fill="#191919">자동 평가 실행</text>
  <line x1="477" y1="188" x2="723" y2="188" stroke="#e9e9e9" stroke-width="1.5"/>
  <text class="t" x="477" y="226" font-size="18" font-weight="700" fill="#191919">calledTool / notCalledTool</text>
  <text class="t" x="477" y="258" font-size="17" fill="#6d6d6d">조회 도구 호출·승인 도구 미호출,</text>
  <text class="t" x="477" y="284" font-size="17" fill="#6d6d6d">JSON 스키마·사실성 점수 확인</text>
  <text class="t" x="477" y="336" font-size="16" fill="#e34f32">purpose: "eval"로 외부 쓰기 차단</text>

  <!-- arrow 2 -> 3 -->
  <path d="M755 236 L813 236" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M803 228 L815 236 L803 244" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- step 3 -->
  <rect x="818" y="76" width="310" height="320" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="850" y="122" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">3단계 · 힐클라이밍</text>
  <text class="t" x="850" y="164" font-size="30" font-weight="700" fill="#191919">단일 레버 수정</text>
  <line x1="850" y1="188" x2="1096" y2="188" stroke="#e9e9e9" stroke-width="1.5"/>
  <text class="t" x="850" y="226" font-size="18" font-weight="700" fill="#191919">가장 앞단의 원인 하나만 변경</text>
  <text class="t" x="850" y="258" font-size="17" fill="#6d6d6d">호스트 증거 사전 준비 → 지침 →</text>
  <text class="t" x="850" y="284" font-size="17" fill="#6d6d6d">스킬 → 도구 제한 순으로 조정</text>
  <text class="t" x="850" y="336" font-size="16" fill="#6d6d6d">개선된 경우에만 새 평가로 잠금</text>

  <!-- feedback loop arrow from 3 back to 1 -->
  <path d="M973 396 L973 442 L227 442 L227 398" fill="none" stroke="#e34f32" stroke-width="2"/>
  <path d="M219 408 L227 396 L235 408" fill="none" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="600" y="430" text-anchor="middle" font-size="16" font-weight="700" fill="#e34f32">같은 입력으로 재실행해 기존 평가가 깨지지 않았는지 검증</text>

  <!-- bottom comparison box: Hillclimbing measured result -->
  <rect x="72" y="490" width="1056" height="146" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="108" y="534" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">측정 사례 · 호스트 증거 사전 준비 전후 비교</text>

  <text class="t" x="108" y="576" font-size="19" font-weight="700" fill="#6d6d6d">수정 전</text>
  <text class="t" x="200" y="576" font-size="19" fill="#6d6d6d">도구 호출 14회 · 실행 시간 92초 · 반복 읽기 6회</text>

  <text class="t" x="108" y="612" font-size="19" font-weight="700" fill="#e34f32">수정 후</text>
  <text class="t" x="200" y="612" font-size="19" font-weight="700" fill="#191919">도구 호출 5회 · 실행 시간 31초 · 반복 읽기 0회</text>
  <text class="t" x="660" y="612" font-size="17" fill="#6d6d6d">(동일한 정답 유지, 새 회귀 테스트로 고정)</text>
</svg>
