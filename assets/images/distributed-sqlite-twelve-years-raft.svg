<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="클라이언트의 쓰기가 리더를 거쳐 팔로워에 복제되고 네트워크 분할로 고립된 노드는 쓰기를 거부하는 rqlite의 구조">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <rect x="70" y="270" width="200" height="120" fill="#fafafa"/>
  <text class="t" x="170" y="322" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">클라이언트</text>
  <text class="t" x="170" y="356" text-anchor="middle" font-size="17" fill="#6d6d6d">INSERT 요청</text>

  <path d="M276 330 L410 330" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M400 322 L412 330 L400 338" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="343" y="312" text-anchor="middle" font-size="16" fill="#6d6d6d">① 쓰기</text>

  <rect x="420" y="250" width="260" height="160" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="450" y="290" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">LEADER</text>
  <text class="t" x="450" y="330" font-size="30" font-weight="700" fill="#191919">리더</text>
  <text class="t" x="450" y="364" font-size="17" fill="#6d6d6d">Raft 로그에 먼저 적고</text>
  <text class="t" x="450" y="390" font-size="17" fill="#6d6d6d">과반 승인 뒤 SQLite에 반영</text>

  <rect x="860" y="90" width="260" height="120" fill="#fafafa"/>
  <text class="t" x="890" y="140" font-size="30" font-weight="700" fill="#191919">팔로워 1</text>
  <text class="t" x="890" y="176" font-size="17" fill="#6d6d6d">로그 복제 · 승인</text>

  <rect x="860" y="270" width="260" height="120" fill="#fafafa"/>
  <text class="t" x="890" y="320" font-size="30" font-weight="700" fill="#191919">팔로워 2</text>
  <text class="t" x="890" y="356" font-size="17" fill="#6d6d6d">로그 복제 · 승인</text>

  <path d="M686 290 L850 165" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M838 164 L852 164 L847 177" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M686 330 L850 330" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M840 322 L852 330 L840 338" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="770" y="200" text-anchor="middle" font-size="16" fill="#6d6d6d">② 복제</text>
  <text class="t" x="770" y="318" text-anchor="middle" font-size="16" fill="#6d6d6d">③ 승인</text>

  <path d="M60 470 L1140 470" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="10 8"/>
  <text class="t" x="1140" y="456" text-anchor="end" font-size="16" fill="#6d6d6d">네트워크 분할</text>

  <rect x="860" y="510" width="260" height="120" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="890" y="560" font-size="30" font-weight="700" fill="#191919">팔로워 3</text>
  <text class="t" x="890" y="596" font-size="17" font-weight="700" fill="#e34f32">고립된 소수 → 쓰기 거부</text>

  <text class="t" x="70" y="560" font-size="19" fill="#191919">노드 4대 중 리더를 포함한 3대가 기록하면 쓰기가 확정된다.</text>
  <text class="t" x="70" y="592" font-size="19" fill="#6d6d6d">데이터가 어긋날 바에야 응답하지 않는 쪽을 고른 CP 설계다.</text>
</svg>
