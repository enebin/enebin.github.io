<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="선행 용어가 장기기억에 정착되지 않아 작업기억이 과부하되는 일반 독서와 본문 내 회상 질문 및 간격 반복으로 작업기억 여유를 확보하는 Quantum Country의 비교">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Top: Normal reading overload -->
  <rect x="80" y="65" width="1040" height="225" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="120" y="110" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">기존의 책 읽기</text>
  <text class="t" x="120" y="150" font-size="28" font-weight="700" fill="#191919">방금 본 용어가 덜 익은 채로 겹쳐 작업기억이 멈춘다</text>

  <rect x="120" y="176" width="280" height="84" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="260" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">1장: 새 용어 10개 등장</text>
  <text class="t" x="260" y="238" text-anchor="middle" font-size="16" fill="#6d6d6d">눈에는 익지만 장기기억 미정착</text>

  <path d="M400 218 L470 218" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M460 210 L470 218 L460 226" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="470" y="176" width="290" height="84" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="615" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">2장: 복합 문장 읽기</text>
  <text class="t" x="615" y="238" text-anchor="middle" font-size="16" fill="#6d6d6d">1장 용어 여럿이 한 문장에 등장</text>

  <path d="M760 218 L830 218" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M820 210 L830 218 L820 226" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="830" y="176" width="250" height="84" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="955" y="212" text-anchor="middle" font-size="18" font-weight="700" fill="#e34f32">작업기억 과부하</text>
  <text class="t" x="955" y="238" text-anchor="middle" font-size="16" fill="#6d6d6d">새 개념을 흡수할 여유 상실</text>

  <!-- Bottom: Quantum Country -->
  <rect x="80" y="330" width="1040" height="280" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="120" y="375" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">QUANTUM COUNTRY의 설계</text>
  <text class="t" x="120" y="415" font-size="28" font-weight="700" fill="#191919">짧은 인출과 간격 반복을 읽는 과정 안에 심어 작업기억을 비운다</text>

  <rect x="120" y="445" width="210" height="120" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="225" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">몇 분간 본문 읽기</text>
  <text class="t" x="225" y="513" text-anchor="middle" font-size="15" fill="#6d6d6d">양자컴퓨팅 개념을</text>
  <text class="t" x="225" y="535" text-anchor="middle" font-size="15" fill="#6d6d6d">짧은 호흡으로 제시</text>

  <path d="M330 505 L380 505" stroke="#e34f32" stroke-width="2"/>
  <path d="M370 497 L380 505 L370 513" fill="none" stroke="#e34f32" stroke-width="2"/>

  <rect x="380" y="445" width="220" height="120" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="490" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">본문 속 즉시 테스트</text>
  <text class="t" x="490" y="513" text-anchor="middle" font-size="15" fill="#6d6d6d">방금 읽은 핵심 인출</text>
  <text class="t" x="490" y="535" text-anchor="middle" font-size="15" fill="#e34f32">빈틈 발견 시 위로 스크롤</text>

  <path d="M600 505 L650 505" stroke="#e34f32" stroke-width="2"/>
  <path d="M640 497 L650 505 L640 513" fill="none" stroke="#e34f32" stroke-width="2"/>

  <rect x="650" y="445" width="210" height="120" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="755" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">간격 반복 이메일</text>
  <text class="t" x="755" y="513" text-anchor="middle" font-size="15" fill="#6d6d6d">며칠 · 몇 주 · 몇 달 뒤</text>
  <text class="t" x="755" y="535" text-anchor="middle" font-size="15" fill="#6d6d6d">장기기억으로 정착</text>

  <path d="M860 505 L910 505" stroke="#e34f32" stroke-width="2"/>
  <path d="M900 497 L910 505 L900 513" fill="none" stroke="#e34f32" stroke-width="2"/>

  <rect x="910" y="445" width="170" height="120" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="995" y="485" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">2장 진입</text>
  <text class="t" x="995" y="513" text-anchor="middle" font-size="15" fill="#6d6d6d">여유로워진</text>
  <text class="t" x="995" y="535" text-anchor="middle" font-size="15" fill="#6d6d6d">작업기억으로 독해</text>

  <text class="t" x="1120" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">선행 지식이 유창해지면 독자는 다음 장의 새 아이디어 자체에 집중할 수 있다</text>
</svg>
