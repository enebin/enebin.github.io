<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Apache 2.0 가중치 공개를 사용자에게 유용한 결과로 보는 해석과 회사의 경쟁 전략으로 보는 해석을 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <rect x="300" y="72" width="600" height="96" fill="#fafafa"/>
  <text class="t" x="600" y="112" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">같은 사실</text>
  <text class="t" x="600" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#191919">30B 모델 가중치, Apache 2.0 공개</text>

  <path d="M600 174 L600 206" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M600 206 L300 206" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M600 206 L900 206" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M300 206 L300 244" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M292 236 L300 246 L308 236" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M900 206 L900 244" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M892 236 L900 246 L908 236" fill="none" stroke="#c9c9c9" stroke-width="2"/>

  <rect x="96" y="264" width="456" height="300" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="136" y="318" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">공개의 가치를 본다</text>
  <text class="t" x="136" y="362" font-size="30" font-weight="700" fill="#191919">선물이다</text>
  <text class="t" x="136" y="410" font-size="18" fill="#6d6d6d">제약이 적은 라이선스는 Llama 때보다</text>
  <text class="t" x="136" y="438" font-size="18" fill="#6d6d6d">확실히 나아진 것이다</text>
  <text class="t" x="136" y="482" font-size="18" fill="#6d6d6d">이 크기의 선택지가 늘어나면</text>
  <text class="t" x="136" y="510" font-size="18" fill="#6d6d6d">쓰는 사람에게 좋다</text>

  <rect x="648" y="264" width="456" height="300" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="688" y="318" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">회사의 동기를 본다</text>
  <text class="t" x="688" y="362" font-size="30" font-weight="700" fill="#191919">경쟁 전략이다</text>
  <text class="t" x="688" y="410" font-size="18" fill="#6d6d6d">성능이 서로 비슷해진 뒤에는</text>
  <text class="t" x="688" y="438" font-size="18" fill="#6d6d6d">가중치 공개가 중요한 차별점이 된다</text>
  <text class="t" x="688" y="482" font-size="18" fill="#6d6d6d">직접 수익을 내기 어렵다면</text>
  <text class="t" x="688" y="510" font-size="18" fill="#6d6d6d">평판과 생태계를 얻을 수 있다</text>

  <text class="t" x="600" y="638" text-anchor="middle" font-size="19" fill="#191919">두 해석은 서로를 반박하지 않는다. 같은 스레드 안에 나란히 있었다.</text>
</svg>
