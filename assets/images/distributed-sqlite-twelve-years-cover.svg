<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="rqlite 개발자가 돌아본 분산 SQLite 12년 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">DISTRIBUTED SQLITE</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">rqlite 개발자가 돌아본</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">분산 SQLite 12년</text>

  <rect x="90" y="330" width="300" height="200" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="120" y="380" font-size="30" font-weight="700" fill="#191919">합의</text>
  <text class="t" x="120" y="416" font-size="17" fill="#6d6d6d">리더 하나 · 클러스터</text>
  <text class="t" x="120" y="500" font-size="17" fill="#191919">rqlite, dqlite</text>

  <rect x="450" y="330" width="300" height="200" fill="#fafafa"/>
  <text class="t" x="480" y="380" font-size="30" font-weight="700" fill="#191919">스트리밍</text>
  <text class="t" x="480" y="416" font-size="17" fill="#6d6d6d">서버 하나 · S3 복구</text>
  <text class="t" x="480" y="500" font-size="17" fill="#191919">Litestream</text>

  <rect x="810" y="330" width="300" height="200" fill="#fafafa"/>
  <text class="t" x="840" y="380" font-size="30" font-weight="700" fill="#191919">병합</text>
  <text class="t" x="840" y="416" font-size="17" fill="#6d6d6d">쓰기 주체 여럿 · CRDT</text>
  <text class="t" x="840" y="500" font-size="17" fill="#191919">cr-sqlite</text>

  <text class="t" x="1110" y="640" text-anchor="end" font-size="17" fill="#6d6d6d">2014 rqlite → 2021 Litestream → 2022 cr-sqlite · D1 → 2026 Turso 인수</text>
</svg>
