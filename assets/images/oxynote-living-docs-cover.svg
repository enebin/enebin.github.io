<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="차트와 설명과 리뷰를 한 페이지에 모은 위키라는 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">OXYNOTE</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">실시간 지표 차트와 PR 리뷰를 합친</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">기술 위키 Oxynote</text>

  <!-- page card -->
  <rect x="90" y="300" width="520" height="260" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <rect x="120" y="330" width="460" height="110" fill="#fafafa"/>
  <polyline points="140,420 190,405 240,412 290,380 340,392 390,355 440,370 490,340 540,350" fill="none" stroke="#191919" stroke-width="2.5"/>
  <path d="M140 372 L560 372" stroke="#e34f32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t" x="120" y="478" font-size="17" fill="#191919">이 선을 넘으면 큐 길이부터 본다.</text>
  <path d="M120 496 L540 496" stroke="#e9e9e9" stroke-width="2"/>
  <path d="M120 514 L420 514" stroke="#e9e9e9" stroke-width="2"/>

  <!-- review strip on the right -->
  <rect x="680" y="300" width="430" height="260" fill="#fafafa"/>
  <text class="t" x="710" y="345" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">변경 하나</text>
  <text class="t" x="710" y="395" font-size="30" font-weight="700" fill="#191919">초안 → diff → 승인</text>
  <text class="t" x="710" y="440" font-size="18" fill="#6d6d6d">차트와 문장이 같은 리뷰를 거친다</text>
  <text class="t" x="710" y="470" font-size="18" fill="#6d6d6d">읽는 사람은 지친 당직자와 에이전트</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">조각이 한곳에 있어야 한 번에 고칠 수 있다</text>
</svg>
