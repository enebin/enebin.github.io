<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="noreply.net 도메인을 사자 40만 통의 기업 메일이 도착한 사건을 소개하는 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="96" y="112" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">NOREPLY.NET</text>
  <text class="t" x="96" y="182" font-size="48" font-weight="700" fill="#191919">아무도 안 읽는다고</text>
  <text class="t" x="96" y="240" font-size="48" font-weight="700" fill="#191919">믿었던 주소</text>
  <text class="t" x="96" y="292" font-size="20" fill="#6d6d6d">자리 표시자로 적은 도메인은 누군가 살 수 있다</text>

  <line x1="96" y1="356" x2="1104" y2="356" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="96" y="418" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">벌어진 일</text>
  <text class="t" x="96" y="466" font-size="30" font-weight="700" fill="#191919">기업이 스스로 보낸 자료</text>
  <text class="t" x="96" y="502" font-size="18" fill="#6d6d6d">부상 보고서, 계정 개설 안내, 테스트 자격 증명</text>

  <text class="t" x="96" y="574" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">뚫린 것</text>
  <text class="t" x="96" y="622" font-size="30" font-weight="700" fill="#191919">없다</text>
  <text class="t" x="96" y="658" font-size="18" fill="#6d6d6d">취약점도 침입도 없었다. 등록비를 내고 기다렸을 뿐이다</text>

  <rect x="820" y="386" width="284" height="272" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="962" y="452" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">도착한 메일</text>
  <text class="t" x="962" y="512" text-anchor="middle" font-size="40" font-weight="700" fill="#191919">401,796통</text>
  <text class="t" x="962" y="556" text-anchor="middle" font-size="17" fill="#6d6d6d">2024년 12월 이후</text>
  <line x1="860" y1="588" x2="1064" y2="588" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="962" y="624" text-anchor="middle" font-size="17" fill="#191919">하루 평균 700통꼴</text>
</svg>
