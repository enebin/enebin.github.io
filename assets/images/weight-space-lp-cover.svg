<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="GPT-6 Astra의 8시간 시행착오 가중치 탐색을 1분짜리 선형계획법 최적화로 대체한 실험을 비교하는 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">WEIGHT-SPACE LP</text>
  <text class="t" x="90" y="165" font-size="44" font-weight="700" fill="#191919">GPT-6 Astra의 8시간 가중치 공간 프로그래밍을</text>
  <text class="t" x="90" y="222" font-size="44" font-weight="700" fill="#191919">1분짜리 선형계획법으로 푼 실험</text>

  <rect x="90" y="320" width="440" height="200" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="310" y="375" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">ASTRA 시행착오 탐색</text>
  <text class="t" x="310" y="432" text-anchor="middle" font-size="30" font-weight="700" fill="#6d6d6d">약 8시간 · 순전파 28회</text>
  <text class="t" x="310" y="476" text-anchor="middle" font-size="18" fill="#6d6d6d">가중치 130,188개 변경 → MATH-500 50.9%</text>

  <path d="M530 420 L640 420" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M630 412 L640 420 L630 428" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="640" y="320" width="470" height="200" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="875" y="375" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">선형계획법 (LP) 최적화</text>
  <text class="t" x="875" y="432" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">GPU 솔버 약 1분 계산</text>
  <text class="t" x="875" y="476" text-anchor="middle" font-size="18" fill="#6d6d6d">가중치 16,291개(1/8) 변경 → MATH-500 51.7%</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">Qwen3.5-0.8B 반복 추론 제거 — 방향 진단과 수치 최적화의 분업</text>
</svg>
