<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="stablyai/orca 저장소의 일평균 82개 커밋, 77개 PR 병합, 최근 닫힌 PR 100개 기준 병합까지 중앙값 25분, 정식 릴리즈 간격 중앙값 24.5시간을 한눈에 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="78" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">STABLYAI/ORCA · 2026.03.17 – 2026.11.03</text>
  <text class="t" x="90" y="122" font-size="30" font-weight="700" fill="#191919">소수 핵심 팀과 에이전트가 만든 처리량과 저장소 입력 규칙</text>

  <!-- 4 metric boxes -->
  <rect x="90" y="160" width="240" height="170" fill="#fafafa"/>
  <text class="t" x="120" y="205" font-size="16" font-weight="700" fill="#6d6d6d">일평균 커밋</text>
  <text class="t" x="120" y="262" font-size="30" font-weight="700" fill="#191919">하루 약 82개</text>
  <text class="t" x="120" y="302" font-size="17" fill="#6d6d6d">누적 18,886개 커밋</text>

  <rect x="350" y="160" width="240" height="170" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="380" y="205" font-size="16" font-weight="700" fill="#e34f32">일평균 병합 PR</text>
  <text class="t" x="380" y="262" font-size="30" font-weight="700" fill="#191919">하루 약 77개</text>
  <text class="t" x="380" y="302" font-size="17" fill="#6d6d6d">누적 17,841개 병합</text>

  <rect x="610" y="160" width="240" height="170" fill="#fafafa"/>
  <text class="t" x="640" y="205" font-size="16" font-weight="700" fill="#6d6d6d">병합 소요 중앙값</text>
  <text class="t" x="640" y="262" font-size="30" font-weight="700" fill="#191919">약 25분</text>
  <text class="t" x="640" y="302" font-size="17" fill="#6d6d6d">최근 닫힌 100개 중 96개 병합</text>

  <rect x="870" y="160" width="240" height="170" fill="#fafafa"/>
  <text class="t" x="900" y="205" font-size="16" font-weight="700" fill="#6d6d6d">커밋 집중도</text>
  <text class="t" x="900" y="262" font-size="30" font-weight="700" fill="#191919">상위 5계정 85.7%</text>
  <text class="t" x="900" y="302" font-size="17" fill="#6d6d6d">소수 팀 + 에이전트 증폭</text>

  <!-- Arrow down -->
  <path d="M600 345 L600 385" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M592 377 L600 387 L608 377" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="624" y="372" font-size="16" fill="#6d6d6d">구두 설명 없이 속도를 유지하는 기반</text>

  <!-- Bottom rule box -->
  <rect x="90" y="400" width="1020" height="210" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="130" y="448" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">AGENTS.MD &amp; SKILLS DIRECTORY</text>
  <text class="t" x="130" y="490" font-size="30" font-weight="700" fill="#191919">암묵적 관행을 에이전트가 매번 읽는 코드 규칙으로 고정</text>
  <text class="t" x="130" y="535" font-size="18" fill="#191919">· 푸시 직전 pnpm check:changed 필수 실행 · CI 반복 조회 대신 gh pr checks --watch 대기</text>
  <text class="t" x="130" y="570" font-size="18" fill="#6d6d6d">· macOS·Windows·Linux·SSH·모바일 동시 고려 · 숨겨진 렌더러(ORCA_BACKGROUND_LAUNCH=1) UI 검증</text>

  <text class="t" x="1110" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">사람은 목표와 위험 기준을 정하고 에이전트는 명문화된 규칙 안에서 실행한다</text>
</svg>
