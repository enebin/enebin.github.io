<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="에이전트가 매 단계마다 긴 문맥을 반복 전송할 때 프롬프트 캐싱 적용률에 따라 실제 지불 단가가 표시 가격 대비 43~89% 낮아지는 구조를 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="72" y="64" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">AGENT WORKLOAD &amp; PROMPT CACHING</text>
  <text class="t" x="1128" y="64" text-anchor="end" font-size="16" fill="#6d6d6d">주간 토큰: 에이전트 131조 vs 인간 18조 (2026.09)</text>
  <line x1="72" y1="84" x2="1128" y2="84" stroke="#e9e9e9" stroke-width="2"/>

  <!-- Left box: Agent repeated context -->
  <rect x="72" y="114" width="500" height="360" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="108" y="158" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">에이전트 실행 구조</text>
  <text class="t" x="108" y="200" font-size="30" font-weight="700" fill="#191919">매 단계 긴 문맥 재전송</text>

  <rect x="108" y="228" width="320" height="56" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="128" y="262" font-size="17" font-weight="700" fill="#e34f32">캐시된 이전 문맥 (할인 청구)</text>
  <rect x="428" y="228" width="108" height="56" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="482" y="262" text-anchor="middle" font-size="16" fill="#191919">1단계</text>

  <rect x="108" y="300" width="340" height="56" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="128" y="334" font-size="17" font-weight="700" fill="#e34f32">캐시된 이전 문맥 + 1단계</text>
  <rect x="448" y="300" width="88" height="56" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="492" y="334" text-anchor="middle" font-size="16" fill="#191919">2단계</text>

  <rect x="108" y="372" width="360" height="56" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="128" y="406" font-size="17" font-weight="700" fill="#e34f32">캐시된 이전 문맥 + 1·2단계</text>
  <rect x="468" y="372" width="68" height="56" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="502" y="406" text-anchor="middle" font-size="16" fill="#191919">3단계</text>

  <!-- Right box: Cache rate jump -->
  <rect x="616" y="114" width="512" height="360" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="652" y="158" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">캐시 적용률 경쟁</text>
  <text class="t" x="652" y="200" font-size="30" font-weight="700" fill="#191919">표시 가격보다 낮은 실지불액</text>

  <rect x="652" y="228" width="440" height="96" fill="#fafafa" stroke="#e9e9e9" stroke-width="1.5"/>
  <text class="t" x="676" y="262" font-size="16" font-weight="700" fill="#6d6d6d">출시 시기별 에이전트 트래픽 캐시 비율</text>
  <text class="t" x="676" y="300" font-size="24" font-weight="700" fill="#191919">2025년 봄 모델 55% → 이번 분기 모델 88%</text>

  <rect x="652" y="344" width="440" height="102" fill="#fafafa" stroke="#e9e9e9" stroke-width="1.5"/>
  <text class="t" x="676" y="378" font-size="16" font-weight="700" fill="#6d6d6d">인기 오픈 웨이트 3종 실제 지불 비용</text>
  <text class="t" x="676" y="414" font-size="24" font-weight="700" fill="#e34f32">표시 가격 환산액 대비 43~89% 절감</text>
  <text class="t" x="676" y="438" font-size="16" fill="#6d6d6d">90% 이상 캐시 공급업체: 1월 35곳 중 2곳 → 9월 54곳 중 11곳</text>

  <!-- Bottom bar: Decoupling -->
  <rect x="72" y="508" width="1056" height="130" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="108" y="548" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">USAGE VS SPEND DECOUPLING</text>
  <text class="t" x="108" y="590" font-size="28" font-weight="700" fill="#191919">사용량과 지출의 분리</text>
  <text class="t" x="410" y="576" font-size="19" font-weight="700" fill="#191919">AI 네이티브 스타트업: 토큰 18배 증가 · 지출 5.1배 증가</text>
  <text class="t" x="410" y="610" font-size="19" fill="#6d6d6d">대형 조직: 토큰 5.1배 증가 · 지출 2.4배 증가</text>
</svg>
