<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="앱 끄기는 pm enable로, 내장 YouTube 제거는 install-existing으로 되돌릴 수 있고, setupwraith 끄기와 기본 런처 끄기와 켜 둔 ADB 포트는 바로 확인해야 한다는 것을 세 칸으로 나눈 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- column 1 -->
  <rect x="70" y="80" width="330" height="520" fill="#fafafa"/>
  <text class="t" x="100" y="126" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">다시 켜면 돌아온다</text>
  <text class="t" x="100" y="176" font-size="30" font-weight="700" fill="#191919">앱 끄기</text>
  <text class="t" x="100" y="214" font-size="17" fill="#6d6d6d">기본 런처, 복구 패키지,</text>
  <text class="t" x="100" y="240" font-size="17" fill="#6d6d6d">쓰지 않는 Google 앱 여섯 개</text>
  <path d="M100 280 L370 280" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="100" y="320" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">되돌리기</text>
  <text class="t" x="100" y="356" font-size="19" fill="#191919">pm enable &lt;패키지&gt;</text>

  <!-- column 2 -->
  <rect x="435" y="80" width="330" height="520" fill="#fafafa"/>
  <text class="t" x="465" y="126" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">원본이 기기에 남아 있다</text>
  <text class="t" x="465" y="176" font-size="30" font-weight="700" fill="#191919">YouTube 제거</text>
  <text class="t" x="465" y="214" font-size="17" fill="#6d6d6d">펌웨어 내장 앱을</text>
  <text class="t" x="465" y="240" font-size="17" fill="#6d6d6d">현재 사용자에게서만 지웠다</text>
  <path d="M465 280 L735 280" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="465" y="320" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">되돌리기</text>
  <text class="t" x="465" y="356" font-size="19" fill="#191919">cmd package</text>
  <text class="t" x="465" y="384" font-size="19" fill="#191919">install-existing &lt;패키지&gt;</text>

  <!-- column 3 -->
  <rect x="800" y="80" width="330" height="520" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="830" y="126" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">바로 확인할 것</text>
  <text class="t" x="830" y="176" font-size="30" font-weight="700" fill="#191919">부작용</text>

  <text class="t" x="830" y="226" font-size="19" font-weight="700" fill="#191919">저장된 Wi-Fi</text>
  <text class="t" x="830" y="254" font-size="17" fill="#6d6d6d">setupwraith를 끄면 지워질 수 있다</text>

  <text class="t" x="830" y="312" font-size="19" font-weight="700" fill="#191919">HDMI 입력 전환</text>
  <text class="t" x="830" y="340" font-size="17" fill="#6d6d6d">기본 런처가 맡고 있었을 수 있다</text>

  <text class="t" x="830" y="398" font-size="19" font-weight="700" fill="#e34f32">열린 ADB 포트</text>
  <text class="t" x="830" y="426" font-size="17" fill="#6d6d6d">같은 네트워크의 다른 기기가</text>
  <text class="t" x="830" y="452" font-size="17" fill="#6d6d6d">접속할 수 있다. 디버깅을 끈다</text>

  <text class="t" x="1130" y="656" text-anchor="end" font-size="17" fill="#6d6d6d">왼쪽 두 칸은 명령 한 줄로 돌아온다. 오른쪽은 끝내기 전에 직접 본다</text>
</svg>
