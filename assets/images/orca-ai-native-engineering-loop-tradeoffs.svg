<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="작은 작업 단위가 에이전트 구현과 다중 리뷰, 선택적 CI, 자동 릴리즈를 거쳐 다시 저장소 규칙으로 승격되는 순환 루프와 그 이면의 미병합 PR 적체 및 동질적 오류 위험을 함께 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Top section: Feedback loop -->
  <text class="t" x="80" y="75" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">CLOSED-LOOP RELEASE &amp; RULE RATCHET</text>
  <text class="t" x="80" y="118" font-size="30" font-weight="700" fill="#191919">실수를 저장소 규칙으로 승격하는 순환 공정과 남은 한계</text>

  <!-- 4 boxes in flow -->
  <rect x="80" y="150" width="230" height="115" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="105" y="188" font-size="15" font-weight="700" fill="#6d6d6d">STEP 1</text>
  <text class="t" x="105" y="220" font-size="20" font-weight="700" fill="#191919">작은 작업과 구현</text>
  <text class="t" x="105" y="248" font-size="16" fill="#6d6d6d">구현·테스트·PR 보고서</text>

  <path d="M310 207 L345 207" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M337 200 L345 207 L337 214" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="345" y="150" width="230" height="115" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="370" y="188" font-size="15" font-weight="700" fill="#6d6d6d">STEP 2</text>
  <text class="t" x="370" y="220" font-size="20" font-weight="700" fill="#191919">다중 리뷰·선택 CI</text>
  <text class="t" x="370" y="248" font-size="16" fill="#6d6d6d">에이전트·봇 + 78개 체크</text>

  <path d="M575 207 L610 207" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M602 200 L610 207 L602 214" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="610" y="150" width="245" height="115" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="635" y="188" font-size="15" font-weight="700" fill="#6d6d6d">STEP 3</text>
  <text class="t" x="635" y="220" font-size="20" font-weight="700" fill="#191919">Cut Release 조립</text>
  <text class="t" x="635" y="248" font-size="16" fill="#6d6d6d">24.5시간 간격 · 21개 파일</text>

  <path d="M855 207 L890 207" stroke="#e34f32" stroke-width="2"/>
  <path d="M882 200 L890 207 L882 214" fill="none" stroke="#e34f32" stroke-width="2"/>

  <rect x="890" y="150" width="230" height="115" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="915" y="188" font-size="15" font-weight="700" fill="#e34f32">STEP 4</text>
  <text class="t" x="915" y="220" font-size="20" font-weight="700" fill="#191919">저장소 규칙 승격</text>
  <text class="t" x="915" y="248" font-size="16" fill="#191919">AGENTS.md · lint · ratchet</text>

  <!-- Return feedback line -->
  <path d="M1005 265 L1005 310 L195 310 L195 265" fill="none" stroke="#e34f32" stroke-width="2"/>
  <path d="M188 275 L195 265 L202 275" fill="none" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="600" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e34f32">반복된 지적은 다음 에이전트의 기본 제약 조건으로 편입</text>

  <!-- Bottom section: Tradeoffs / Shadows -->
  <rect x="80" y="365" width="1040" height="245" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="120" y="410" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">STRUCTURAL LIMITS &amp; RISKS</text>
  <text class="t" x="120" y="450" font-size="30" font-weight="700" fill="#191919">높은 생산량 이면에 드러난 4가지 한계</text>

  <text class="t" x="120" y="498" font-size="18" font-weight="700" fill="#191919">1. 검토·정리 적체</text>
  <text class="t" x="120" y="526" font-size="17" fill="#6d6d6d">열린 PR 3,697개 · 미병합 종료 6,009개</text>

  <text class="t" x="620" y="498" font-size="18" font-weight="700" fill="#191919">2. 빠른 병합과 제품 판단 공백</text>
  <text class="t" x="620" y="526" font-size="17" fill="#6d6d6d">중앙값 25분 병합으로 CI 밖의 제품 오류에 취약</text>

  <text class="t" x="120" y="562" font-size="18" font-weight="700" fill="#191919">3. 모델 간 동질적 맹점</text>
  <text class="t" x="120" y="590" font-size="17" fill="#6d6d6d">구현 에이전트·Copilot·CodeRabbit이 같은 실수를 놓칠 위험</text>

  <text class="t" x="620" y="562" font-size="18" font-weight="700" fill="#191919">4. 시스템 복잡도와 출처 불투명성</text>
  <text class="t" x="620" y="590" font-size="17" fill="#6d6d6d">219개 워크플로 관리 부담 · 내부 기여자 AI 사용 내역 미기재</text>

  <text class="t" x="1120" y="658" text-anchor="end" font-size="17" fill="#6d6d6d">자동화된 검증 체계가 코드 품질은 지탱하지만 제품 판단과 적체 해소는 여전히 과제로 남는다</text>
</svg>
