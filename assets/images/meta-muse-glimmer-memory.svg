<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="55GB가 필요한 30B 모델을 4비트로 압축해 20GB 미만으로 줄이고 남은 공간에 KV 캐시와 퍼셉션 인코더와 드래프터를 넣어 24GB 예산 안에 맞추는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="96" y="88" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">그대로 담으면</text>

  <rect x="96" y="112" width="1008" height="92" fill="#fafafa"/>
  <text class="t" x="128" y="152" font-size="30" font-weight="700" fill="#191919">55GB 이상</text>
  <text class="t" x="128" y="184" font-size="18" fill="#6d6d6d">300억 파라미터를 16비트 정밀도로 담았을 때. 소비자용 카드에는 들어가지 않는다</text>

  <path d="M600 210 L600 250" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M592 242 L600 252 L608 242" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="626" y="244" font-size="17" fill="#6d6d6d">가중치를 약 4비트로 압축한다</text>

  <text class="t" x="96" y="306" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">24GB 메모리 안에 넣으면</text>

  <rect x="96" y="330" width="1008" height="220" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>

  <rect x="128" y="366" width="512" height="148" fill="#fafafa"/>
  <text class="t" x="160" y="410" font-size="16" font-weight="700" fill="#6d6d6d">언어 모델</text>
  <text class="t" x="160" y="452" font-size="30" font-weight="700" fill="#191919">20GB 미만</text>
  <text class="t" x="160" y="486" font-size="17" fill="#6d6d6d">에이전트 작업에서 성능 저하는 거의 없었다</text>

  <rect x="664" y="366" width="176" height="148" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="752" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">KV 캐시</text>
  <text class="t" x="752" y="456" text-anchor="middle" font-size="16" fill="#6d6d6d">대화가 길수록</text>
  <text class="t" x="752" y="480" text-anchor="middle" font-size="16" fill="#6d6d6d">쌓이는 작업 기억</text>

  <rect x="864" y="366" width="104" height="148" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="916" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">인코더</text>
  <text class="t" x="916" y="456" text-anchor="middle" font-size="16" fill="#6d6d6d">이미지</text>
  <text class="t" x="916" y="480" text-anchor="middle" font-size="16" fill="#6d6d6d">읽기</text>

  <rect x="992" y="366" width="80" height="148" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="1032" y="424" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">드래프터</text>
  <text class="t" x="1032" y="456" text-anchor="middle" font-size="16" fill="#6d6d6d">생성 속도</text>
  <text class="t" x="1032" y="480" text-anchor="middle" font-size="16" fill="#6d6d6d">높이기</text>

  <text class="t" x="96" y="614" font-size="18" fill="#6d6d6d">24GB 메모리 안에 언어 모델과 에이전트 실행에 필요한 구성 요소를 함께 넣었다.</text>
  <text class="t" x="1104" y="662" text-anchor="end" font-size="17" fill="#6d6d6d">24GB · 32GB 그래픽카드 기준</text>
</svg>
