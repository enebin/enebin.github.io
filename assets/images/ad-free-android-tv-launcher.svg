<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Projectivy를 홈 앱으로 지정하고, 기본 런처 launcherx를 끄고, 복구 패키지 setupwraith를 끄는 세 단계와 각 단계의 주의점">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- comparison strip -->
  <text class="t" x="90" y="80" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">런처 덮어쓰기 옵션</text>
  <text class="t" x="90" y="116" font-size="19" fill="#6d6d6d">기본 런처는 살아 있다. 기본 홈 화면이 잠깐씩 다시 보인다</text>
  <text class="t" x="90" y="170" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">ADB로 교체</text>
  <text class="t" x="90" y="206" font-size="19" fill="#191919">기본 런처와 그것을 되살리는 패키지를 함께 끈다</text>
  <path d="M90 244 L1110 244" stroke="#e9e9e9" stroke-width="2"/>

  <!-- step 1 -->
  <rect x="90" y="290" width="300" height="190" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="120" y="334" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">1 · 먼저</text>
  <text class="t" x="120" y="380" font-size="30" font-weight="700" fill="#191919">홈 앱 지정</text>
  <text class="t" x="120" y="420" font-size="17" fill="#6d6d6d">set-home-activity</text>
  <text class="t" x="120" y="448" font-size="17" fill="#6d6d6d">→ Projectivy</text>

  <path d="M396 385 L444 385" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M434 377 L444 385 L434 393" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- step 2 -->
  <rect x="450" y="290" width="300" height="190" fill="#fafafa"/>
  <text class="t" x="480" y="334" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">2</text>
  <text class="t" x="480" y="380" font-size="30" font-weight="700" fill="#191919">기본 런처 끄기</text>
  <text class="t" x="480" y="420" font-size="17" fill="#6d6d6d">disable-user</text>
  <text class="t" x="480" y="448" font-size="17" fill="#6d6d6d">launcherx</text>

  <path d="M756 385 L804 385" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M794 377 L804 385 L794 393" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- step 3 -->
  <rect x="810" y="290" width="300" height="190" fill="#fafafa"/>
  <text class="t" x="840" y="334" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">3</text>
  <text class="t" x="840" y="380" font-size="30" font-weight="700" fill="#191919">복구 패키지 끄기</text>
  <text class="t" x="840" y="420" font-size="17" fill="#6d6d6d">disable-user</text>
  <text class="t" x="840" y="448" font-size="17" fill="#6d6d6d">setupwraith</text>

  <!-- warnings -->
  <path d="M600 486 L600 530" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="600" y="566" text-anchor="middle" font-size="18" fill="#6d6d6d">끈 뒤에 HDMI 입력 전환이 되는지 확인</text>

  <path d="M960 486 L960 600" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="1110" y="636" text-anchor="end" font-size="18" font-weight="700" fill="#e34f32">일부 기기는 저장된 Wi-Fi가 지워진다</text>
  <text class="t" x="1110" y="664" text-anchor="end" font-size="16" fill="#6d6d6d">리모컨을 가까이 둘 것</text>
</svg>
