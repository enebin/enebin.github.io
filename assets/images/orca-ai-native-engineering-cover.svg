<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="AI를 코딩 도구로만 쓰는 방식에서 개발 공정 전체를 에이전트 중심으로 재설계한 Orca의 운영 체계를 대비한 표지 그림">
