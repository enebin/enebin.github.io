  <text class="t" x="600" y="382" text-anchor="middle" font-size="18" fill="#6d6d6d">완료 조건 · 범위 · 출력 방식</text>
  <rect x="70" y="270" width="250" height="160" fill="#fafafa"/>
  <text class="t" x="195" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">effort</text>
  <text class="t" x="195" y="378" text-anchor="middle" font-size="18" fill="#6d6d6d">품질 · 비용 · 시간</text>
  <rect x="880" y="270" width="250" height="160" fill="#fafafa"/>
  <text class="t" x="1005" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">도구 루프</text>
  <text class="t" x="1005" y="378" text-anchor="middle" font-size="18" fill="#6d6d6d">진행 표시 · 병렬 호출</text>
  <rect x="390" y="510" width="420" height="110" fill="#fafafa"/>
