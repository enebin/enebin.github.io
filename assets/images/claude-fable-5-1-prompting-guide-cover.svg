  <path d="M372 342 L384 350 L372 358" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M810 350 L872 350" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M860 342 L874 350 L860 358" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M600 440 L600 502" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M592 490 L600 504 L608 490" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="1110" y="662" text-anchor="end" font-size="17" fill="#6d6d6d">모델 교체는 실행 환경까지 함께 맞추는 작업이다</text>
