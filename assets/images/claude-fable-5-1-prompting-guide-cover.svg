<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="프롬프트를 중심으로 effort와 도구 루프와 대화 이력을 함께 조정하는 구조">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="90" y="88" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">CLAUDE FABLE 5.1</text>
  <text class="t" x="90" y="142" font-size="30" font-weight="700" fill="#191919">프롬프트만 바꾸면 끝일까?</text>
