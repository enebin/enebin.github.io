<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="무거운 사람용 브라우저에서 에이전트 작업에 필요한 얇은 실행 경로만 남긴 Kitesurf 표지 그림">
