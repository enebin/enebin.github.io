<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="사람용 브라우저 기능 여섯 가지 중 앞의 세 가지를 지우고 뒤의 세 가지만 남긴 Kitesurf 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="96" y="112" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">AGENT-FIRST BROWSER</text>
  <text class="t" x="96" y="182" font-size="48" font-weight="700" fill="#191919">브라우저에서 사람을 빼면</text>
  <text class="t" x="96" y="240" font-size="48" font-weight="700" fill="#191919">무엇이 남을까</text>
  <text class="t" x="96" y="292" font-size="20" fill="#6d6d6d">Cloudflare가 에이전트만을 위해 만든 브라우저 엔진, Kitesurf</text>

  <text class="t" x="96" y="382" font-size="16" font-weight="700" fill="#6d6d6d">덜어낸 것</text>
  <text class="t" x="606" y="382" font-size="16" font-weight="700" fill="#e34f32">남긴 것</text>

  <rect x="96" y="400" width="158" height="90" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="175" y="452" text-anchor="middle" font-size="16" fill="#a5a5a5">탭 · 확장</text>
  <line x1="129" y1="446" x2="221" y2="446" stroke="#a5a5a5" stroke-width="2"/>

  <rect x="266" y="400" width="158" height="90" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="345" y="452" text-anchor="middle" font-size="16" fill="#a5a5a5">동영상 · WebGL</text>
  <line x1="285" y1="446" x2="405" y2="446" stroke="#a5a5a5" stroke-width="2"/>

  <rect x="436" y="400" width="158" height="90" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="515" y="452" text-anchor="middle" font-size="16" fill="#a5a5a5">픽셀 정확도</text>
  <line x1="467" y1="446" x2="563" y2="446" stroke="#a5a5a5" stroke-width="2"/>

  <rect x="606" y="400" width="158" height="90" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="685" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">레이아웃 · CSS</text>

  <rect x="776" y="400" width="158" height="90" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="855" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">DOM · JS 실행</text>

  <rect x="946" y="400" width="158" height="90" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="1025" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#191919">HTML · 캡처</text>

  <text class="t" x="96" y="574" font-size="18" fill="#6d6d6d">CPU와 메모리는 3배에서 7배 적게, 대신 한 작업은 1.8배 느리게</text>
</svg>
