<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="하나의 프로그램이 사용자와 동료 개발자에게 서로 다른 모습으로 읽히는 관계">
  <style>.t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }</style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="72" y="82" font-size="30" fill="#191919" text-anchor="start">프로그램을 경험하는 두 사람</text>
  <text class="t" x="72" y="119" font-size="16" fill="#6d6d6d" text-anchor="start">같은 결과물의 서로 다른 접점</text>
  <rect x="430" y="175" width="340" height="110" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="600" y="241" font-size="30" fill="#191919" text-anchor="middle">검색 기능</text>
  <path d="M500 285 L330 390 M343.4 388.8 L330 390 L337.1 378.6" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M700 285 L870 390 M862.9 378.6 L870 390 L856.6 388.8" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="100" y="395" width="450" height="185" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="130" y="449" font-size="30" fill="#191919" text-anchor="start">사용자</text>
  <text class="t" x="130" y="502" font-size="18" fill="#191919" text-anchor="start">검색 결과 · 화면</text>
  <text class="t" x="130" y="542" font-size="18" fill="#6d6d6d" text-anchor="start">빈 검색어 · 실패 안내</text>
  <rect x="650" y="395" width="450" height="185" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="680" y="449" font-size="30" fill="#191919" text-anchor="start">다음 개발자</text>
  <text class="t" x="680" y="502" font-size="18" fill="#191919" text-anchor="start">함수 이름 · 구조</text>
  <text class="t" x="680" y="542" font-size="18" fill="#6d6d6d" text-anchor="start">수정 위치 · 오류 흐름</text>
  <text class="t" x="600" y="640" font-size="18" fill="#e34f32" text-anchor="middle">동작과 읽기 경험을 함께 살핀다</text>
</svg>
