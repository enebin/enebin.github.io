<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="제안, 초안, 승인 후 실행, 실행 후 보고의 네 단계 자율성 다이얼과 양방향 문, 일방통행 문 행동이 각각 다이얼의 어느 쪽으로 가는지 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="70" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">자율성 다이얼</text>
  <path d="M90 92 L1110 92" stroke="#e9e9e9" stroke-width="2"/>
  <path d="M1100 86 L1110 92 L1100 98" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="1110" y="70" text-anchor="end" font-size="15" fill="#6d6d6d">에이전트가 혼자 하는 몫이 커진다 →</text>

  <rect x="90" y="120" width="240" height="140" fill="#fafafa"/>
  <text class="t" x="120" y="162" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">1</text>
  <text class="t" x="120" y="204" font-size="30" font-weight="700" fill="#191919">제안</text>
  <text class="t" x="120" y="236" font-size="17" fill="#6d6d6d">할 일을 알려만 준다</text>

  <rect x="350" y="120" width="240" height="140" fill="#fafafa"/>
  <text class="t" x="380" y="162" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">2</text>
  <text class="t" x="380" y="204" font-size="30" font-weight="700" fill="#191919">초안</text>
  <text class="t" x="380" y="236" font-size="17" fill="#6d6d6d">결과물을 써 두고 기다린다</text>

  <rect x="610" y="120" width="240" height="140" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="640" y="162" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">3</text>
  <text class="t" x="640" y="204" font-size="30" font-weight="700" fill="#191919">승인 후 실행</text>
  <text class="t" x="640" y="236" font-size="17" fill="#6d6d6d">사람이 확인해야 움직인다</text>

  <rect x="870" y="120" width="240" height="140" fill="#fafafa"/>
  <text class="t" x="900" y="162" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">4</text>
  <text class="t" x="900" y="204" font-size="30" font-weight="700" fill="#191919">실행 후 보고</text>
  <text class="t" x="900" y="236" font-size="17" fill="#6d6d6d">먼저 하고 나중에 알린다</text>

  <rect x="90" y="420" width="500" height="200" fill="#fafafa"/>
  <text class="t" x="130" y="468" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">되돌릴 수 있다</text>
  <text class="t" x="130" y="512" font-size="30" font-weight="700" fill="#191919">양방향 문</text>
  <text class="t" x="130" y="552" font-size="19" fill="#191919">읽기 · 요약 · 초안 작성</text>
  <text class="t" x="130" y="586" font-size="17" fill="#6d6d6d">틀려도 다시 나오면 된다</text>

  <rect x="610" y="420" width="500" height="200" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="650" y="468" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">되돌릴 수 없다</text>
  <text class="t" x="650" y="512" font-size="30" font-weight="700" fill="#191919">일방통행 문</text>
  <text class="t" x="650" y="552" font-size="19" fill="#191919">지출 · 발송 · 삭제 · 게시</text>
  <text class="t" x="650" y="586" font-size="17" fill="#6d6d6d">한 번 틀리면 사고가 된다</text>

  <path d="M340 410 L960 278" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M948 276 L960 278 L951 287" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="420" y="352" font-size="16" fill="#6d6d6d">검증된 흐름이면 다이얼을 올린다</text>

  <path d="M860 410 L760 278" stroke="#e34f32" stroke-width="2"/>
  <path d="M758 291 L760 278 L771 286" fill="none" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="830" y="352" font-size="16" fill="#e34f32">사람의 승인을 거친다</text>

  <text class="t" x="1110" y="664" text-anchor="end" font-size="17" fill="#6d6d6d">도구마다 어느 문인지 표시하면 권한 설계의 대부분이 정해진다</text>
</svg>
