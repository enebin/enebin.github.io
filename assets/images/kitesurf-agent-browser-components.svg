<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="요청이 Engine, PageScript, PageRenderer로 흐르고 SandboxOutbound만 외부 웹에 접근하는 구조도">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="76" y="86" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">ISOLATION BY ROLE</text>
  <text class="t" x="76" y="134" font-size="30" font-weight="700" fill="#191919">권한을 나누면 실패도 작아진다</text>

  <rect x="76" y="220" width="230" height="190" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="112" y="278" font-size="30" font-weight="700" fill="#191919">Engine</text>
  <text class="t" x="112" y="324" font-size="18" fill="#6d6d6d">CDP 요청</text>
  <text class="t" x="112" y="358" font-size="18" fill="#6d6d6d">세션 상태</text>

  <path d="M306 315 L368 315" stroke="#e34f32" stroke-width="3"/>
  <path d="M354 305 L370 315 L354 325" fill="none" stroke="#e34f32" stroke-width="3"/>

  <rect x="370" y="220" width="230" height="190" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="406" y="278" font-size="30" font-weight="700" fill="#191919">PageScript</text>
  <text class="t" x="406" y="324" font-size="18" fill="#6d6d6d">DOM · CSS</text>
  <text class="t" x="406" y="358" font-size="18" fill="#6d6d6d">JavaScript</text>

  <path d="M600 315 L662 315" stroke="#e34f32" stroke-width="3"/>
  <path d="M648 305 L664 315 L648 325" fill="none" stroke="#e34f32" stroke-width="3"/>

  <rect x="664" y="220" width="230" height="190" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="700" y="278" font-size="30" font-weight="700" fill="#191919">Renderer</text>
  <text class="t" x="700" y="324" font-size="18" fill="#6d6d6d">PNG · PDF</text>
  <text class="t" x="700" y="358" font-size="18" fill="#6d6d6d">상태 없음</text>

  <rect x="370" y="492" width="524" height="116" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="406" y="544" font-size="30" font-weight="700" fill="#191919">SandboxOutbound</text>
  <text class="t" x="406" y="582" font-size="18" fill="#6d6d6d">쿠키 분리 · CORS · 응답 필터 · 유일한 외부 통로</text>

  <path d="M485 410 L485 476" stroke="#e34f32" stroke-width="3"/>
  <path d="M475 462 L485 478 L495 462" fill="none" stroke="#e34f32" stroke-width="3"/>
  <path d="M894 550 L1054 550" stroke="#e34f32" stroke-width="3"/>
  <path d="M1040 540 L1056 550 L1040 560" fill="none" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="1080" y="544" font-size="18" font-weight="700" fill="#191919">웹</text>
  <text class="t" x="1080" y="576" font-size="16" fill="#6d6d6d">불신 입력</text>
</svg>
