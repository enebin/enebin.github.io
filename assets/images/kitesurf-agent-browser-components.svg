<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="에이전트가 CDP로 Engine에 붙고 Engine·PageScript·PageRenderer가 아이솔레이트 안에 있으며 SandboxOutbound만 외부 웹으로 나가는 구조도">
