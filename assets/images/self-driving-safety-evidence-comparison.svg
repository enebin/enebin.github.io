<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="서로 다른 사고 기록을 공통 기준과 주행거리로 비교하는 흐름">
<style>.t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }</style>
<rect width="1200" height="700" fill="#ffffff"/>
<text class="t" x="70" y="80" font-size="30" fill="#191919" font-weight="700">사고율을 비교하기까지</text><rect x="70" y="155" width="310" height="150" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="95" y="210" font-size="30" fill="#191919" font-weight="700">사람 운전 기록</text><text class="t" x="95" y="260" font-size="18" fill="#191919">경찰에 신고된 사고</text><path d="M385 230 L465 230 m-9 -7 l9 7 -9 7" fill="none" stroke="#6d6d6d" stroke-width="2"/><rect x="70" y="360" width="310" height="150" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="95" y="415" font-size="30" fill="#191919" font-weight="700">무인 차량 기록</text><text class="t" x="95" y="465" font-size="18" fill="#191919">업체가 제출한 사고 보고서</text><path d="M385 435 L465 435 m-9 -7 l9 7 -9 7" fill="none" stroke="#6d6d6d" stroke-width="2"/><rect x="480" y="155" width="270" height="355" fill="#ffffff" stroke="#e34f32" stroke-width="2"/><text class="t" x="505" y="235" font-size="30" fill="#191919" font-weight="700">사고 기준 맞추기</text><text class="t" x="505" y="310" font-size="19" fill="#191919">보고서 내용을 읽고</text><text class="t" x="505" y="345" font-size="19" fill="#191919">신고할 만한 사고로 분류</text><text class="t" x="505" y="435" font-size="18" fill="#6d6d6d">지역·기간도 맞춘다</text><path d="M760 335 L830 335 m-9 -7 l9 7 -9 7" fill="none" stroke="#6d6d6d" stroke-width="2"/><rect x="845" y="155" width="285" height="355" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/><text class="t" x="870" y="235" font-size="30" fill="#191919" font-weight="700">사고 관여율</text><text class="t" x="870" y="310" font-size="19" fill="#191919">분류한 사고 건수</text><path d="M870 330 H1100" stroke="#6d6d6d" stroke-width="2"/><text class="t" x="870" y="370" font-size="19" fill="#191919">해당 조건의 주행거리</text><text class="t" x="870" y="445" font-size="17" fill="#6d6d6d">양쪽을 각각 계산해 비교</text><text class="t" x="70" y="605" font-size="19" fill="#191919">사고를 세는 방식이나 주행거리의 범위가 다르면 비교 결과도 달라진다.</text><text class="t" x="70" y="655" font-size="16" fill="#6d6d6d">IIHS 연구 방법을 바탕으로 재구성</text>
</svg>