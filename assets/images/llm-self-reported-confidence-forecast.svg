<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="정보가 없을 때는 확신도가 계절 평균 30%에 머물고 정보가 쌓일수록 0%나 100% 쪽으로 멀어지는 모습을 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- axis labels -->
  <text class="t" x="340" y="92" text-anchor="middle" font-size="16" fill="#6d6d6d">0%</text>
  <text class="t" x="556" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#6d6d6d">30% (계절 평균)</text>
  <text class="t" x="1060" y="92" text-anchor="middle" font-size="16" fill="#6d6d6d">100%</text>
  <path d="M556 104 L556 600" stroke="#e9e9e9" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- row 1: no information -->
  <text class="t" x="80" y="170" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">2주 전</text>
  <text class="t" x="80" y="206" font-size="30" font-weight="700" fill="#191919">정보 없음</text>
  <path d="M340 200 L1060 200" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="546" y="190" width="20" height="20" fill="#191919"/>
  <text class="t" x="590" y="248" font-size="17" fill="#6d6d6d">쓸 정보가 없으니 평균을 말한다</text>

  <!-- row 2: some information -->
  <text class="t" x="80" y="350" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">며칠 전</text>
  <text class="t" x="80" y="386" font-size="30" font-weight="700" fill="#191919">정보 조금</text>
  <path d="M340 380 L1060 380" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="402" y="370" width="20" height="20" fill="#191919"/>
  <rect x="474" y="370" width="20" height="20" fill="#191919"/>
  <rect x="690" y="370" width="20" height="20" fill="#191919"/>
  <rect x="810" y="370" width="20" height="20" fill="#191919"/>
  <text class="t" x="590" y="428" font-size="17" fill="#6d6d6d">정보가 들어오면 평균에서 멀어지기 시작한다</text>

  <!-- row 3: much information -->
  <text class="t" x="80" y="530" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">당일 아침</text>
  <text class="t" x="80" y="566" font-size="30" font-weight="700" fill="#191919">정보 많음</text>
  <path d="M340 560 L1060 560" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="340" y="550" width="20" height="20" fill="#e34f32"/>
  <rect x="384" y="550" width="20" height="20" fill="#e34f32"/>
  <rect x="990" y="550" width="20" height="20" fill="#e34f32"/>
  <rect x="1040" y="550" width="20" height="20" fill="#e34f32"/>
  <text class="t" x="590" y="608" font-size="17" fill="#6d6d6d">대부분의 예측이 0%와 100% 근처에 몰린다</text>

  <text class="t" x="1060" y="668" text-anchor="end" font-size="17" fill="#6d6d6d">한 칸은 예보 하나. 확신도는 정보의 양을 따라 움직인다</text>
</svg>
