<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Xcode 베타와 안정 버전 분리로 2TB까지 불어나는 VM 이미지를 레지스트리에서 희소 형식과 얕은 복사 계층으로 줄이는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="78" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">2TB VM IMAGES TO SPARSE LAYERS</text>
  <text class="t" x="90" y="122" font-size="30" font-weight="700" fill="#191919">2TB까지 불어나는 Xcode 이미지를 희소 계층으로 압축하기</text>

  <!-- Left box: Naive 2TB -->
  <rect x="90" y="165" width="450" height="440" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="125" y="210" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">단순 디스크 이미지 보관</text>
  <text class="t" x="125" y="250" font-size="28" font-weight="700" fill="#191919">합계 2TB (2TB SSD 포화)</text>

  <rect x="125" y="280" width="380" height="65" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="145" y="319" font-size="18" font-weight="700" fill="#191919">현재 macOS + 안정 버전 Xcode (500GB)</text>

  <rect x="125" y="358" width="380" height="65" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="145" y="388" font-size="18" font-weight="700" fill="#191919">현재 macOS + 베타 Xcode 분리본 (500GB)</text>
  <text class="t" x="145" y="412" font-size="15" fill="#e34f32">전역 CoreDevice·CoreSimulator 오염 방지</text>

  <rect x="125" y="436" width="380" height="65" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="145" y="475" font-size="18" font-weight="700" fill="#191919">이전 macOS 테스트용 이미지 (500GB)</text>

  <rect x="125" y="514" width="380" height="65" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="145" y="553" font-size="18" font-weight="700" fill="#191919">차기 macOS 개발자 프리뷰 (500GB)</text>

  <!-- Arrow -->
  <path d="M555 385 L625 385" stroke="#191919" stroke-width="2"/>
  <path d="M615 377 L625 385 L615 393" fill="none" stroke="#191919" stroke-width="2"/>

  <!-- Right box: Registry + APFS -->
  <rect x="640" y="165" width="470" height="440" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="675" y="210" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">레지스트리 계층화 + APFS 블록 공유</text>
  <text class="t" x="675" y="250" font-size="28" font-weight="700" fill="#191919">변경 블록만 저장하고 공유</text>

  <rect x="675" y="280" width="400" height="90" fill="#fafafa" stroke="#191919" stroke-width="2"/>
  <text class="t" x="695" y="314" font-size="16" font-weight="700" fill="#6d6d6d">공통 기반 계층 (Base Layer)</text>
  <text class="t" x="695" y="346" font-size="19" font-weight="700" fill="#191919">macOS + 기본 Xcode + iOS 런타임</text>

  <rect x="675" y="388" width="190" height="85" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="695" y="420" font-size="15" font-weight="700" fill="#e34f32">얕은 복사 계층 A</text>
  <text class="t" x="695" y="450" font-size="18" font-weight="700" fill="#191919">안정판 추가 블록만</text>

  <rect x="885" y="388" width="190" height="85" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="905" y="420" font-size="15" font-weight="700" fill="#e34f32">얕은 복사 계층 B</text>
  <text class="t" x="905" y="450" font-size="18" font-weight="700" fill="#191919">베타 변경 블록만</text>

  <rect x="675" y="492" width="400" height="87" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="695" y="524" font-size="17" font-weight="700" fill="#191919">희소 파일(Sparsity) + clonefile(cp -c)</text>
  <text class="t" x="695" y="554" font-size="17" fill="#6d6d6d">100GB 빈 구간은 몇 바이트로 기록 · 덮어쓴 블록만 새 할당</text>

  <text class="t" x="1110" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">레지스트리와 로컬 APFS 양쪽에서 빈 공간과 중복 블록을 걷어낸다</text>
</svg>
