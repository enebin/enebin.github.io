<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="주간 토큰이 5,000억 개에서 164조 개로 늘어나는 동안 100만 토큰당 평균 가격이 0.77달러에서 0.14달러로 내려간 AI 토큰 경제 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">OPENROUTER · AI TOKENOMICS</text>
  <text class="t" x="90" y="165" font-size="44" font-weight="700" fill="#191919">OpenRouter 데이터로 본 AI 토큰 비용과</text>
  <text class="t" x="90" y="222" font-size="44" font-weight="700" fill="#191919">프롬프트 캐싱의 경제학</text>

  <rect x="90" y="330" width="460" height="190" fill="#fafafa"/>
  <text class="t" x="130" y="385" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">주간 토큰 처리량 (2025.01 → 2026.09)</text>
  <text class="t" x="130" y="445" font-size="34" font-weight="700" fill="#191919">5,000억 → 164조</text>
  <text class="t" x="130" y="485" font-size="18" fill="#6d6d6d">에이전트 주간 131조 · 오픈 웨이트 비중 60%</text>

  <path d="M565 425 L625 425" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M615 417 L625 425 L615 433" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="640" y="330" width="470" height="190" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="680" y="385" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">100만 토큰당 평균 지불 단가</text>
  <text class="t" x="680" y="445" font-size="34" font-weight="700" fill="#191919">$0.77 → $0.14</text>
  <text class="t" x="680" y="485" font-size="18" fill="#6d6d6d">프롬프트 캐싱 + 저가 모델 이동 + 실질 총비용 라우팅</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">연간 고정 소프트웨어 계약에서 분 단위로 움직이는 원자재 조달 시장으로</text>
</svg>
