<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="하루 머지가 2026년 5월 약 2,500건에서 9월 3만 건 이상으로 늘었고, 하루 2,500만 번의 CI 체크아웃을 그대로 받으면 600PB가 넘는다는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">하루 머지 수</text>
  <path d="M90 560 L560 560" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="150" y="522" width="140" height="38" fill="#e9e9e9"/>
  <text class="t" x="220" y="505" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">약 2,500</text>
  <text class="t" x="220" y="596" text-anchor="middle" font-size="18" fill="#6d6d6d">2026년 5월</text>
  <rect x="360" y="150" width="140" height="410" fill="#e34f32"/>
  <text class="t" x="430" y="133" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">3만 이상</text>
  <text class="t" x="430" y="596" text-anchor="middle" font-size="18" fill="#6d6d6d">2026년 9월</text>
  <text class="t" x="90" y="650" font-size="17" fill="#6d6d6d">넉 달 만에 열 배 넘게 늘었다</text>

  <path d="M640 90 L640 620" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="720" y="100" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">그대로 복사하면</text>
  <rect x="720" y="130" width="400" height="110" fill="#fafafa"/>
  <text class="t" x="750" y="178" font-size="30" font-weight="700" fill="#191919">작업 사본 25GB+</text>
  <text class="t" x="750" y="214" font-size="18" fill="#6d6d6d">main 기록만 100GB 가까이</text>
  <text class="t" x="920" y="282" text-anchor="middle" font-size="30" fill="#6d6d6d">×</text>
  <rect x="720" y="306" width="400" height="110" fill="#fafafa"/>
  <text class="t" x="750" y="354" font-size="30" font-weight="700" fill="#191919">체크아웃 2,500만 번</text>
  <text class="t" x="750" y="390" font-size="18" fill="#6d6d6d">CI에서만, 하루 기준</text>
  <path d="M920 426 L920 462" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M912 454 L920 464 L928 454" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="720" y="474" width="400" height="110" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="750" y="522" font-size="30" font-weight="700" fill="#e34f32">하루 600PB 이상</text>
  <text class="t" x="750" y="558" font-size="18" fill="#6d6d6d">아무 요령 없이 받을 때의 Git 트래픽</text>
  <text class="t" x="1120" y="650" text-anchor="end" font-size="17" fill="#6d6d6d">미러 수백 대로도 버티기 어려웠다</text>
</svg>
