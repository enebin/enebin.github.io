<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="브라우저 기능을 여섯 층으로 나눠 사람용 브라우저는 전부 갖추고 Kitesurf는 위 세 층을 덜어낸 뒤 아래 세 층만 남긴 비교 그림">
  <style>
