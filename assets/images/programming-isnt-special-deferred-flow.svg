<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="매번 처리 함수를 전달하는 방식과 Deferred를 받아 처리 순서를 연결하는 방식의 비교">
  <style>.t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }</style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="72" y="82" font-size="30" fill="#191919" text-anchor="start">비동기 작업과 처리 흐름을 연결하는 방식</text>
  <text class="t" x="72" y="119" font-size="16" fill="#6d6d6d" text-anchor="start">개념 비교 · 실제 API의 모든 규칙은 생략</text>
  <text class="t" x="85" y="181" font-size="30" fill="#191919" text-anchor="start">호출마다 함수를 전달</text>
  <text class="t" x="685" y="181" font-size="30" fill="#191919" text-anchor="start">결과 객체에 흐름을 연결</text>
  <rect x="85" y="225" width="180" height="90" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="175" y="279" font-size="18" fill="#191919" text-anchor="middle">호출 A</text>
  <path d="M270 270 L345 270 M333.0 264.0 L345 270 L333.0 276.0" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="350" y="215" width="200" height="110" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="450" y="253" font-size="18" fill="#191919" text-anchor="middle">callback</text>
  <text class="t" x="450" y="297" font-size="18" fill="#191919" text-anchor="middle">errback</text>
  <rect x="85" y="375" width="180" height="90" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="175" y="429" font-size="18" fill="#191919" text-anchor="middle">호출 B</text>
  <path d="M270 420 L345 420 M333.0 414.0 L345 420 L333.0 426.0" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="350" y="365" width="200" height="110" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="450" y="403" font-size="18" fill="#191919" text-anchor="middle">callback</text>
  <text class="t" x="450" y="447" font-size="18" fill="#191919" text-anchor="middle">errback</text>
  <text class="t" x="85" y="531" font-size="18" fill="#6d6d6d" text-anchor="start">성공과 실패 함수를 매번 전달</text>
  <rect x="685" y="225" width="420" height="80" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="895" y="275" font-size="18" fill="#191919" text-anchor="middle">호출 → Deferred 반환</text>
  <path d="M895 308 L895 358 M901.0 346.0 L895 358 L889.0 346.0" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="685" y="365" width="420" height="150" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="715" y="407" font-size="18" fill="#e34f32" text-anchor="start">처리 흐름 등록</text>
  <text class="t" x="715" y="447" font-size="18" fill="#191919" text-anchor="start">결과 → 처리 → 다음 처리</text>
  <text class="t" x="715" y="484" font-size="18" fill="#6d6d6d" text-anchor="start">예외 → 오류 처리 흐름</text>
  <text class="t" x="685" y="559" font-size="18" fill="#6d6d6d" text-anchor="start">결과가 준비되면 등록한 흐름 실행</text>
  <text class="t" x="72" y="636" font-size="16" fill="#6d6d6d" text-anchor="start">Twisted Deferred 문서의 기본 동작을 단순화한 그림</text>
</svg>
