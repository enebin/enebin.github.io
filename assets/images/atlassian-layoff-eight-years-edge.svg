<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="백엔드마다 공통 기능을 따로 구현하는 경우와 엣지 프록시와 사이드카가 한 번에 처리하는 경우의 비교">
