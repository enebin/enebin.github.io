<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="물리 Mac 한 대당 2개로 제한된 macOS VM과 VMM 프로세스, Namespace VM 호스트 사이의 IPC 네트워크 처리 경로를 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="78" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">APPLE VIRTUALIZATION &amp; IPC</text>
  <text class="t" x="90" y="122" font-size="30" font-weight="700" fill="#191919">2개 VM 제한과 프로세스 간 통신(IPC)을 거치는 네트워크</text>

  <!-- Outer physical Mac container -->
  <rect x="90" y="155" width="1020" height="455" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="125" y="195" font-size="16" font-weight="700" fill="#6d6d6d">물리 Mac 호스트 (Mac 한 대당 최대 2개 macOS VM 제한 · 관리용 코어 별도 예약)</text>

  <!-- Guest VM 1 & VMM -->
  <rect x="125" y="220" width="270" height="160" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text class="t" x="150" y="255" font-size="15" font-weight="700" fill="#6d6d6d">별도 OS 프로세스 1</text>
  <text class="t" x="150" y="292" font-size="26" font-weight="700" fill="#191919">VMM 프로세스 #1</text>
  <text class="t" x="150" y="325" font-size="17" fill="#6d6d6d">macOS 게스트 VM 실행</text>
  <text class="t" x="150" y="352" font-size="16" fill="#6d6d6d">6코어(Mini) / 8코어(MacBook)</text>

  <!-- Guest VM 2 & VMM -->
  <rect x="125" y="410" width="270" height="160" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text class="t" x="150" y="445" font-size="15" font-weight="700" fill="#6d6d6d">별도 OS 프로세스 2</text>
  <text class="t" x="150" y="482" font-size="26" font-weight="700" fill="#191919">VMM 프로세스 #2</text>
  <text class="t" x="150" y="515" font-size="17" fill="#6d6d6d">macOS 게스트 VM 실행</text>
  <text class="t" x="150" y="542" font-size="16" fill="#6d6d6d">또는 1개에 12코어 / 16코어 할당</text>

  <!-- IPC Arrows -->
  <path d="M395 300 L505 355" stroke="#e34f32" stroke-width="2"/>
  <path d="M495 346 L505 355 L492 356" fill="none" stroke="#e34f32" stroke-width="2"/>
  <path d="M395 490 L505 435" stroke="#e34f32" stroke-width="2"/>
  <path d="M492 434 L505 435 L495 444" fill="none" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="450" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#e34f32">IPC 왕복</text>
  <text class="t" x="450" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#e34f32">일괄 처리</text>

  <!-- Namespace VM Host -->
  <rect x="510" y="255" width="330" height="280" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="540" y="298" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">NAMESPACE VM HOST</text>
  <text class="t" x="540" y="340" font-size="28" font-weight="700" fill="#191919">사용자 공간 네트워크</text>
  <text class="t" x="540" y="380" font-size="18" fill="#191919">Google gVisor TCP/IP 스택</text>
  <text class="t" x="540" y="410" font-size="17" fill="#6d6d6d">· 모든 패킷을 소프트웨어로 검사</text>
  <text class="t" x="540" y="438" font-size="17" fill="#6d6d6d">· 고객별 외부 통신(Egress) 정책 강제</text>
  <text class="t" x="540" y="466" font-size="17" fill="#6d6d6d">· 미처리 패킷의 호스트 OS 노출 차단</text>
  <text class="t" x="540" y="504" font-size="16" font-weight="700" fill="#e34f32">Fast.com 업로드 대역폭 4Gbps 달성</text>

  <!-- Arrow to NIC -->
  <path d="M840 395 L910 395" stroke="#191919" stroke-width="2"/>
  <path d="M900 387 L910 395 L900 403" fill="none" stroke="#191919" stroke-width="2"/>

  <!-- Physical NIC -->
  <rect x="915" y="320" width="165" height="150" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text class="t" x="997" y="375" text-anchor="middle" font-size="15" font-weight="700" fill="#6d6d6d">호스트 인터페이스</text>
  <text class="t" x="997" y="412" text-anchor="middle" font-size="24" font-weight="700" fill="#191919">10G NIC</text>
  <text class="t" x="997" y="442" text-anchor="middle" font-size="16" fill="#6d6d6d">외부 네트워크</text>

  <text class="t" x="1110" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">VMM과 호스트가 분리돼 있어 패킷과 가상 장치 상호작용마다 문맥 전환 비용이 든다</text>
</svg>
