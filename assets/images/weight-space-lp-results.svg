<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="기본 모델과 Astra 수정, 선형계획법 수정, 고정 조향 벡터의 변경 가중치 수와 벤치마크 성능을 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="80" y="78" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">BENCHMARK &amp; STEERING VECTOR</text>
  <text class="t" x="80" y="122" font-size="30" font-weight="700" fill="#191919">8분의 1 가중치로 동등한 성능을 내고 고정 조향 벡터로 재현된 효과</text>

  <!-- Row 1: Base model -->
  <rect x="80" y="160" width="1040" height="95" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="196" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">기본 모델 (QWEN3.5-0.8B)</text>
  <text class="t" x="115" y="232" font-size="28" font-weight="700" fill="#6d6d6d">변경 가중치 0개</text>
  <text class="t" x="540" y="228" font-size="19" fill="#6d6d6d">GSM8K 14.1%   ·   MATH-500 7.0%   ·   IFEval 22.9%</text>

  <!-- Row 2: Astra edit -->
  <rect x="80" y="272" width="1040" height="95" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="308" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">ASTRA 가중치 수정 (층당 64개 열, α=6)</text>
  <text class="t" x="115" y="344" font-size="28" font-weight="700" fill="#191919">130,188개 변경</text>
  <text class="t" x="540" y="340" font-size="19" fill="#191919">GSM8K 68.2%   ·   MATH-500 50.9%   ·   IFEval 61.9%</text>

  <!-- Row 3: LP with Astra's u -->
  <rect x="80" y="384" width="1040" height="105" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="115" y="422" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">선형계획법 수정 (ASTRA 방향 u, 층당 8개 열)</text>
  <text class="t" x="115" y="462" font-size="30" font-weight="700" fill="#e34f32">16,291개 변경 (1/8)</text>
  <text class="t" x="540" y="458" font-size="19" font-weight="700" fill="#191919">GSM8K 69.6%   ·   MATH-500 51.7%   ·   IFEval 59.7%</text>

  <!-- Row 4: LP with Heuristic u & Steering vector -->
  <rect x="80" y="506" width="505" height="115" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="542" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">휴리스틱 방향 LP (LLM 미사용)</text>
  <text class="t" x="115" y="578" font-size="24" font-weight="700" fill="#191919">16,271개 변경 → 효과 93% 재현</text>
  <text class="t" x="115" y="606" font-size="17" fill="#6d6d6d">GSM8K 65.4% · MATH-500 47.8% · IFEval 60.4%</text>

  <rect x="615" y="506" width="505" height="115" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="650" y="542" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">고정 조향 벡터 (가중치 무수정, 1배 강도)</text>
  <text class="t" x="650" y="578" font-size="24" font-weight="700" fill="#191919">MATH-500 50.8% (개발 세트 57.8%)</text>
  <text class="t" x="650" y="606" font-size="17" fill="#6d6d6d">0.5배(51.6%, 반복 재발) · 2배(31.2%, 추론 붕괴)</text>

  <text class="t" x="1120" y="660" text-anchor="end" font-size="17" fill="#6d6d6d">15번 층 8개 열은 전체 토큰의 89%에서 켜져 사실상 일정한 힘을 더하는 조향 벡터처럼 작동한다</text>
</svg>
