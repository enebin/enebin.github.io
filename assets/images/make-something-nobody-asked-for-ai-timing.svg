<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="아이디어 직후 평가하는 경로와 AI로 먼저 만든 뒤 용도를 판단하는 경로를 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="80" y="92" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">평가의 타이밍</text>
  <text class="t" x="80" y="136" font-size="30" font-weight="700" fill="#191919">AI가 빨라져도 첫 질문까지 같을 필요는 없다</text>

  <text class="t" x="80" y="245" font-size="16" font-weight="700" fill="#6d6d6d">너무 이른 경로</text>
  <rect x="220" y="190" width="200" height="100" fill="#fafafa"/>
  <text class="t" x="320" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">아이디어</text>
  <path d="M420 240 L500 240" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M490 232 L500 240 L490 248" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="500" y="190" width="260" height="100" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="630" y="232" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">시장 평가</text>
  <text class="t" x="630" y="264" text-anchor="middle" font-size="17" fill="#6d6d6d">틈새 · 수익 · 알고리듬</text>
  <path d="M760 240 L840 240" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M830 232 L840 240 L830 248" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="850" y="232" font-size="30" font-weight="700" fill="#e34f32">중단</text>
  <text class="t" x="850" y="264" font-size="17" fill="#6d6d6d">형태를 알기 전에 탈락</text>

  <path d="M80 350 L1120 350" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="80" y="470" font-size="16" font-weight="700" fill="#6d6d6d">쓸모가 늦게 오는 경로</text>
  <rect x="220" y="415" width="200" height="100" fill="#fafafa"/>
  <text class="t" x="320" y="475" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">아이디어</text>
  <path d="M420 465 L500 465" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M490 457 L500 465 L490 473" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="500" y="415" width="260" height="100" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="630" y="457" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">AI로 제작</text>
  <text class="t" x="630" y="489" text-anchor="middle" font-size="17" fill="#6d6d6d">작게 만들고 직접 확인</text>
  <path d="M760 465 L840 465" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M830 457 L840 465 L830 473" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="840" y="415" width="280" height="100" fill="#fafafa"/>
  <text class="t" x="980" y="457" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">용도 판단</text>
  <text class="t" x="980" y="489" text-anchor="middle" font-size="17" fill="#6d6d6d">완성한 뒤 묻는다</text>

  <text class="t" x="1120" y="610" text-anchor="end" font-size="19" fill="#6d6d6d">제작 속도와 평가 시점은 따로 고를 수 있다</text>
</svg>
