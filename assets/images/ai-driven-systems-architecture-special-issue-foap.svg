<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="형식이 제각각인 에이전트 이벤트를 스키마 없이 받아 원본 보관과 LLM 정규화로 나눈 뒤 함께 저장하는 FOAP 흐름">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- agent events -->
  <text class="t" x="50" y="100" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">에이전트가 보낸 이벤트</text>
  <rect x="50" y="130" width="250" height="90" fill="#fafafa"/>
  <text class="t" x="70" y="168" font-size="18" font-weight="700" fill="#191919">에이전트 A</text>
  <text class="t" x="70" y="198" font-size="16" fill="#6d6d6d">agent_id, status</text>
  <rect x="50" y="250" width="250" height="90" fill="#fafafa"/>
  <text class="t" x="70" y="288" font-size="18" font-weight="700" fill="#191919">에이전트 B</text>
  <text class="t" x="70" y="318" font-size="16" fill="#6d6d6d">actor_id로 이름이 바뀜</text>
  <rect x="50" y="370" width="250" height="90" fill="#fafafa"/>
  <text class="t" x="70" y="408" font-size="18" font-weight="700" fill="#191919">에이전트 C</text>
  <text class="t" x="70" y="438" font-size="16" fill="#6d6d6d">data_size_kb 필드 추가</text>

  <path d="M302 175 L352 280" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M302 295 L352 295" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M302 415 L352 310" stroke="#6d6d6d" stroke-width="2"/>

  <!-- ingest -->
  <rect x="356" y="220" width="210" height="150" fill="#fafafa"/>
  <text class="t" x="376" y="272" font-size="30" font-weight="700" fill="#191919">수집</text>
  <text class="t" x="376" y="310" font-size="16" fill="#6d6d6d">스키마를 강요하지 않고</text>
  <text class="t" x="376" y="334" font-size="16" fill="#6d6d6d">일단 모두 받는다</text>

  <!-- split -->
  <path d="M568 270 L600 270 L600 190 L636 190" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M628 182 L638 190 L628 198" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M568 320 L600 320 L600 420 L636 420" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M628 412 L638 420 L628 428" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="640" y="120" width="270" height="140" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="660" y="170" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">안전망</text>
  <text class="t" x="660" y="206" font-size="30" font-weight="700" fill="#191919">원본 그대로 보관</text>
  <text class="t" x="660" y="238" font-size="16" fill="#6d6d6d">변환이 틀려도 다시 고칠 수 있다</text>

  <rect x="640" y="330" width="270" height="170" fill="#fafafa"/>
  <text class="t" x="660" y="380" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">Gemini 2.5 Flash</text>
  <text class="t" x="660" y="416" font-size="30" font-weight="700" fill="#191919">LLM 정규화</text>
  <text class="t" x="660" y="448" font-size="16" fill="#6d6d6d">표준 필드로 옮겨 JSON만 낸다</text>
  <text class="t" x="660" y="474" font-size="16" fill="#6d6d6d">실패하면 parseError 표시</text>

  <!-- merge -->
  <path d="M912 190 L950 190 L950 270 L976 270" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M912 415 L950 415 L950 320 L976 320" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M968 262 L978 270 L968 278" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M968 312 L978 320 L968 328" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="980" y="220" width="180" height="150" fill="#fafafa"/>
  <text class="t" x="1000" y="272" font-size="30" font-weight="700" fill="#191919">통합 저장</text>
  <text class="t" x="1000" y="310" font-size="16" fill="#6d6d6d">원본과 표준 기록을</text>
  <text class="t" x="1000" y="334" font-size="16" fill="#6d6d6d">나란히 둔다</text>

  <!-- stats -->
  <path d="M50 560 L1160 560" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="50" y="608" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">정규화 성공률</text>
  <text class="t" x="260" y="610" font-size="19" fill="#191919">에이전트 1개 100%</text>
  <text class="t" x="490" y="610" font-size="19" fill="#191919">2개 93.3%</text>
  <text class="t" x="650" y="610" font-size="19" fill="#191919">3개 90%</text>
  <text class="t" x="1160" y="656" text-anchor="end" font-size="17" fill="#6d6d6d">이벤트가 다양해질수록 LLM 변환이 흔들린다 · 시나리오당 이벤트 110개</text>
</svg>
