<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="사내 기존 직원을 지키는 이익 공유 및 내부 재배치 장치와 회사 밖 주니어 구직자가 겪는 채용 감소 사이의 간극을 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">기업 내부의 보호 장치와 기업 바깥에 남는 진입 장벽</text>

  <!-- Left box: Inside the company -->
  <rect x="90" y="100" width="490" height="490" fill="#fafafa"/>
  <text class="t" x="130" y="148" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">기업 내부 · 이미 채용된 기존 직원</text>
  <text class="t" x="130" y="195" font-size="30" font-weight="700" fill="#191919">이익 공유와 내부 재배치</text>

  <rect x="130" y="230" width="410" height="140" fill="#ffffff" stroke="#e9e9e9" stroke-width="1"/>
  <text class="t" x="155" y="268" font-size="18" font-weight="700" fill="#191919">1. 생산성 이익 공유 (주식 보상)</text>
  <text class="t" x="155" y="302" font-size="17" fill="#6d6d6d">자기 업무를 자동화하고 에이전트를 관리하는</text>
  <text class="t" x="155" y="330" font-size="17" fill="#6d6d6d">대가로 기업 가치 상승의 몫을 함께 나눈다</text>

  <rect x="130" y="395" width="410" height="155" fill="#ffffff" stroke="#e9e9e9" stroke-width="1"/>
  <text class="t" x="155" y="433" font-size="18" font-weight="700" fill="#191919">2. 직무 변화 조기 경보와 사내 이동</text>
  <text class="t" x="155" y="467" font-size="17" fill="#6d6d6d">AI 침투가 빠른 직무를 미리 포착해 사내의</text>
  <text class="t" x="155" y="495" font-size="17" fill="#6d6d6d">새 제품·새 시장 업무로 인력을 먼저 옮긴다</text>
  <text class="t" x="155" y="523" font-size="16" fill="#6d6d6d">효과가 미미한 인건비 절감형 자동화를 억제</text>

  <!-- Right box: Outside the company -->
  <rect x="620" y="100" width="490" height="490" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="660" y="148" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">기업 외부 · 새로 진입하려는 초급 인력</text>
  <text class="t" x="660" y="195" font-size="30" font-weight="700" fill="#191919">사내 보호가 닿지 않는 사각지대</text>

  <rect x="660" y="230" width="410" height="140" fill="#fafafa"/>
  <text class="t" x="685" y="268" font-size="18" font-weight="700" fill="#191919">1. 높아진 채용 기준과 줄어든 공고</text>
  <text class="t" x="685" y="302" font-size="17" fill="#6d6d6d">좁은 기술 전문성보다 자율성·판단력·AI 활용을</text>
  <text class="t" x="685" y="330" font-size="17" fill="#6d6d6d">요구하며 주니어 채용 비중이 27%에서 9%로 하락</text>

  <rect x="660" y="395" width="410" height="155" fill="#fafafa"/>
  <text class="t" x="685" y="433" font-size="18" font-weight="700" fill="#e34f32">2. 재교육과 소득 지원의 공백</text>
  <text class="t" x="685" y="467" font-size="17" fill="#191919">기존 직원 재배치 의무는 오히려 신규 채용을</text>
  <text class="t" x="685" y="495" font-size="17" fill="#191919">더 신중하게 만들어 진입 장벽을 높일 수 있다</text>
  <text class="t" x="685" y="523" font-size="16" fill="#6d6d6d">기업 밖의 재교육 및 소득 지원 정책이 필요한 지점</text>

  <text class="t" x="1110" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">기존 직원을 지키는 사내 안전망만으로는 처음부터 채용되지 못한 주니어의 문제를 풀 수 없다</text>
</svg>
