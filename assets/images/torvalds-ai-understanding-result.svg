<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="8스레드에서 읽기 한 번당 커널 CPU 사이클이 2,937~2,975에서 725~726으로 줄었고, 측정 조건과 아직 재지 않은 환경이 함께 적혀 있는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="90" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">8스레드 · 읽기 한 번당 커널 CPU 사이클</text>

  <text class="t" x="90" y="190" font-size="19" font-weight="700" fill="#191919">기존 커널</text>
  <rect x="260" y="150" width="740" height="64" fill="#e9e9e9"/>
  <text class="t" x="1020" y="193" font-size="30" font-weight="700" fill="#191919">2,937~2,975</text>

  <text class="t" x="90" y="300" font-size="19" font-weight="700" fill="#191919">패치 적용 후</text>
  <rect x="260" y="260" width="183" height="64" fill="#e34f32"/>
  <text class="t" x="463" y="303" font-size="30" font-weight="700" fill="#191919">725~726</text>
  <text class="t" x="640" y="301" font-size="18" fill="#6d6d6d">초당 읽기 990만~1,040만 → 3,000만~3,300만 회</text>

  <path d="M90 390 L1110 390" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="90" y="450" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">함께 적은 것</text>
  <rect x="90" y="475" width="500" height="150" fill="#fafafa"/>
  <text class="t" x="120" y="520" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">측정 조건</text>
  <text class="t" x="120" y="560" font-size="18" fill="#191919">Core i7-8565U 노트북 한 대, ext4</text>
  <text class="t" x="120" y="594" font-size="18" fill="#191919">발열로 속도가 변하니 사이클로 비교</text>

  <rect x="610" y="475" width="500" height="150" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="640" y="520" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">아직 모르는 것</text>
  <text class="t" x="640" y="560" font-size="18" fill="#191919">CPU가 더 많은 서버</text>
  <text class="t" x="640" y="594" font-size="18" fill="#191919">소켓이 여러 개인 시스템</text>
</svg>
