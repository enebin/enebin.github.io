<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Contract로 작성한 UI가 컴파일러를 거쳐 실행 계획이 되고 웹 DOM과 네이티브 AppKit·UIKit·Linux 렌더러로 나뉘어 그려지며 데이터 소스만 TypeScript와 Rust로 연결되는 구조도">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Left column: Authoring -->
  <rect x="70" y="90" width="280" height="210" fill="#fafafa"/>
  <text class="t" x="100" y="135" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">화면 선언</text>
  <text class="t" x="100" y="175" font-size="30" font-weight="700" fill="#191919">app.contract</text>
  <text class="t" x="100" y="212" font-size="18" fill="#6d6d6d">view · state · derive · action</text>
  <text class="t" x="100" y="242" font-size="17" fill="#6d6d6d">JS·I/O·반복문·await 금지</text>

  <rect x="70" y="380" width="280" height="210" fill="#fafafa"/>
  <text class="t" x="100" y="425" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">데이터 경계 아래</text>
  <text class="t" x="100" y="465" font-size="30" font-weight="700" fill="#191919">TypeScript / Rust</text>
  <text class="t" x="100" y="502" font-size="18" fill="#6d6d6d">fetch · SQLite · 파일 · 계산</text>
  <text class="t" x="100" y="532" font-size="17" fill="#6d6d6d">네이티브는 Hermes 바이트코드</text>

  <!-- Arrow from Contract to Plan -->
  <path d="M350 195 L430 195" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M422 187 L432 195 L422 203" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- Middle: Compiler & Plan -->
  <rect x="435" y="90" width="290" height="210" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="465" y="135" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">컴파일 결과</text>
  <text class="t" x="465" y="175" font-size="30" font-weight="700" fill="#191919">실행 계획 (Plan)</text>
  <text class="t" x="465" y="212" font-size="18" fill="#6d6d6d">테이블 + 바이트코드</text>
  <text class="t" x="465" y="242" font-size="17" fill="#6d6d6d">초기 상수 데이터를 빌드에 포함</text>

  <!-- Data seam check box -->
  <rect x="435" y="380" width="290" height="210" fill="#fafafa"/>
  <text class="t" x="465" y="425" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">DATA SEAM</text>
  <text class="t" x="465" y="465" font-size="30" font-weight="700" fill="#191919">형태(Shape) 검증</text>
  <text class="t" x="465" y="502" font-size="18" fill="#6d6d6d">선언된 타입과 응답 대조</text>
  <text class="t" x="465" y="532" font-size="17" fill="#6d6d6d">권한(grant) 기반 네트워크·저장소</text>

  <path d="M350 485 L430 485" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M422 477 L432 485 L422 493" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- Arrows to Right column -->
  <path d="M725 155 L815 155" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M807 147 L817 155 L807 163" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <path d="M725 240 L775 240 L775 430 L815 430" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M807 422 L817 430 L807 438" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <path d="M725 485 L815 485" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M807 477 L817 485 L807 493" fill="none" stroke="#c9c9c9" stroke-width="2"/>

  <!-- Right column: Hosts -->
  <rect x="820" y="90" width="310" height="145" fill="#fafafa"/>
  <text class="t" x="850" y="132" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">WEB HOST</text>
  <text class="t" x="850" y="170" font-size="28" font-weight="700" fill="#191919">실제 DOM + CSS</text>
  <text class="t" x="850" y="204" font-size="17" fill="#6d6d6d">약 20KB 런타임 · 단일 ES 모듈</text>

  <rect x="820" y="265" width="310" height="325" fill="#fafafa"/>
  <text class="t" x="850" y="308" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">NATIVE HOSTS</text>
  <text class="t" x="850" y="346" font-size="28" font-weight="700" fill="#191919">Rust Runner + Taffy</text>
  <text class="t" x="850" y="380" font-size="17" fill="#6d6d6d">CSS Block · Flex · Grid 레이아웃 계산</text>

  <path d="M850 402 L1100 402" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="850" y="438" font-size="19" font-weight="700" fill="#191919">macOS</text>
  <text class="t" x="945" y="438" font-size="18" fill="#6d6d6d">AppKit + CoreText</text>
  <text class="t" x="850" y="482" font-size="19" font-weight="700" fill="#191919">iOS</text>
  <text class="t" x="945" y="482" font-size="18" fill="#6d6d6d">UIKit + CoreText</text>
  <text class="t" x="850" y="526" font-size="19" font-weight="700" fill="#191919">Linux</text>
  <text class="t" x="945" y="526" font-size="18" fill="#6d6d6d">vello GPU / tiny-skia CPU</text>
  <text class="t" x="850" y="566" font-size="16" fill="#6d6d6d">WebView 없음 · UI JS 브리지 없음</text>

  <text class="t" x="1130" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">작성한 CSS가 우선하고 지정하지 않은 표현은 각 운영체제 기본값을 따른다</text>
</svg>
