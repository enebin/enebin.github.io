<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Kinetix 자동차 경사로 과제에서 기존 정책에 3.5% 가중치 우회 경로를 덧붙여 성공률을 0%에서 100%로 높이고 MinAtar와 9x9 바둑 신경망을 층별 역할 분담으로 직접 작성한 구조를 보여주는 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="80" y="68" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">실험 4~6 · 신경망 가중치 수리와 작성</text>
  <text class="t" x="80" y="108" font-size="30" font-weight="700" fill="#191919">기존 신경망에 우회 회로를 덧붙이거나 0에서 새 신경망 짜기</text>

  <!-- Left Box: Kinetix Fix -->
  <rect x="80" y="145" width="500" height="480" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="190" font-size="15" font-weight="700" letter-spacing="1" fill="#e34f32">실험 4 · 국소 최적점에 갇힌 정책 수리</text>
  <text class="t" x="115" y="230" font-size="26" font-weight="700" fill="#191919">Kinetix 자동차 경사로 과제</text>

  <rect x="115" y="260" width="430" height="95" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="140" y="298" font-size="18" font-weight="700" fill="#6d6d6d">기존 PPO 정책 (10억 스텝 학습 · 171,664개)</text>
  <text class="t" x="140" y="330" font-size="17" fill="#6d6d6d">곧장 전진하다 경사로에 멈춤 → 성공률 0% (0/256)</text>

  <path d="M330 355 L330 390" stroke="#e34f32" stroke-width="2"/>
  <path d="M322 382 L330 390 L338 382" fill="none" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="348" y="378" font-size="16" font-weight="700" fill="#e34f32">가중치 3.5% (6,073개) 원샷 편집</text>

  <rect x="115" y="395" width="430" height="125" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="140" y="433" font-size="18" font-weight="700" fill="#191919">층별 소수 뉴런을 이은 별도 제어 경로 추가</text>
  <text class="t" x="140" y="465" font-size="17" fill="#191919">1) 먼저 후진해 가속 거리 확보 후 전속력 출발</text>
  <text class="t" x="140" y="495" font-size="17" fill="#191919">2) 빨간 장애물 통과 시 스위치 OFF → 기존 정책 인계</text>

  <text class="t" x="115" y="575" font-size="22" font-weight="700" fill="#e34f32">수정 후 1,024회 평가 모두 성공 (100%)</text>

  <!-- Right Box: From Scratch -->
  <rect x="620" y="145" width="500" height="480" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="655" y="190" font-size="15" font-weight="700" letter-spacing="1" fill="#6d6d6d">실험 5~6 · 모든 가중치가 0인 신경망 직접 작성</text>
  <text class="t" x="655" y="230" font-size="26" font-weight="700" fill="#191919">알고리즘을 층별 가중치로 번역</text>

  <rect x="655" y="260" width="430" height="150" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="680" y="298" font-size="18" font-weight="700" fill="#191919">MinAtar 벽돌깨기 (실행·도구 없이 1회 작성)</text>
  <text class="t" x="680" y="330" font-size="17" fill="#6d6d6d">1층: 공의 방향과 벽 반사로 착지 위치 계산</text>
  <text class="t" x="680" y="358" font-size="17" fill="#6d6d6d">2층: 패들을 목표 위치로 이동 또는 정지</text>
  <text class="t" x="680" y="390" font-size="18" font-weight="700" fill="#e34f32">PPO 1억 스텝(15.8점) · 5억 스텝(25.3점) vs Astra 517.4점</text>

  <rect x="655" y="435" width="430" height="155" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="680" y="473" font-size="18" font-weight="700" fill="#191919">9×9 바둑 (148만 가중치 · Python 코드로 작성)</text>
  <text class="t" x="680" y="505" font-size="17" fill="#6d6d6d">초기·중간층: 돌과 활로 표시 → 연결된 위험 돌무리 탐색</text>
  <text class="t" x="680" y="533" font-size="17" fill="#6d6d6d">마지막층: 포획·구출·자충수 회피를 82개 행동 점수로 변환</text>
  <text class="t" x="680" y="565" font-size="18" font-weight="700" fill="#191919">순전파 50회 피드백 시 2,000만 판 학습한 동급 PPO 격파</text>

  <text class="t" x="1120" y="668" text-anchor="end" font-size="16" fill="#6d6d6d">데이터와 경사하강법 없이도 논리적 규칙을 각 층의 가중치 행렬 연산으로 직접 설계한다</text>
</svg>
