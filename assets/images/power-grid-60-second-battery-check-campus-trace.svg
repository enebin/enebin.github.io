<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="율리히 연구소 캠퍼스 80개 계측 지점 중 UPS가 있는 4개 건물에서 1분 신호를 찾고 배터리 직류 단자에서 110kV 고압 전력망까지 전파 경로를 추적한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="78" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">LIVING LAB ENERGY CAMPUS</text>
  <text class="t" x="90" y="122" font-size="30" font-weight="700" fill="#191919">배터리 직류 단자의 자체 진단 전류가 110kV 송전망까지 번지는 과정</text>

  <!-- Top comparison: 80 points -->
  <rect x="90" y="160" width="480" height="125" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="120" y="198" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">일반 건물 계측 지점 (UPS 없음)</text>
  <text class="t" x="120" y="236" font-size="24" font-weight="700" fill="#6d6d6d">1분 주기 신호 없음</text>
  <text class="t" x="120" y="266" font-size="17" fill="#6d6d6d">캠퍼스 80개 지점 중 UPS 미설치 구역</text>

  <rect x="630" y="160" width="480" height="125" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="660" y="198" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">대형 배터리 UPS 설치 건물 (4곳)</text>
  <text class="t" x="660" y="236" font-size="24" font-weight="700" fill="#191919">4곳 모두 뚜렷한 1분 주기 포착</text>
  <text class="t" x="660" y="266" font-size="17" fill="#6d6d6d">배전망 파형이 송전망보다 위상이 앞서 발생</text>

  <!-- Step-by-step propagation in Building 3 -->
  <text class="t" x="90" y="342" font-size="16" font-weight="700" letter-spacing="2" fill="#191919">건물 3 정밀 계측 — 4단계 신호 전파 경로</text>

  <!-- Step 1 -->
  <rect x="90" y="365" width="225" height="245" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="115" y="405" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">1단계 · DC 단자</text>
  <text class="t" x="115" y="445" font-size="26" font-weight="700" fill="#191919">배터리 EMS</text>
  <text class="t" x="115" y="485" font-size="18" fill="#191919">매분 자체 진단 실행</text>
  <text class="t" x="115" y="513" font-size="18" fill="#191919">좁고 날카로운 직류</text>
  <text class="t" x="115" y="541" font-size="18" fill="#191919">전류 피크 발생</text>
  <path d="M115 580 L165 580 L172 552 L179 580 L235 580 L242 552 L249 580 L290 580" fill="none" stroke="#e34f32" stroke-width="2"/>

  <path d="M315 488 L355 488" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M347 480 L355 488 L347 496" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="355" y="365" width="225" height="245" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="380" y="405" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">2단계 · AC 전후단</text>
  <text class="t" x="380" y="445" font-size="26" font-weight="700" fill="#191919">UPS 내부 소비</text>
  <text class="t" x="380" y="485" font-size="18" fill="#191919">건물 부하를 뺀 뒤</text>
  <text class="t" x="380" y="513" font-size="18" fill="#191919">푸리에 분석으로 3상</text>
  <text class="t" x="380" y="541" font-size="18" fill="#191919">교류 1분 성분 확인</text>
  <path d="M380 580 L410 562 L455 580 L485 562 L530 580 L555 580" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <path d="M580 488 L620 488" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M612 480 L620 488 L612 496" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="620" y="365" width="225" height="245" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="645" y="405" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">3단계 · 캠퍼스 배전</text>
  <text class="t" x="645" y="445" font-size="26" font-weight="700" fill="#191919">변압기 2개·모선</text>
  <text class="t" x="645" y="485" font-size="18" fill="#191919">설비가 저역통과 필터</text>
  <text class="t" x="645" y="513" font-size="18" fill="#191919">역할을 하며 톱니형</text>
  <text class="t" x="645" y="541" font-size="18" fill="#191919">유효전력 파형 형성</text>
  <path d="M645 580 L655 556 L720 580 L730 556 L795 580 L820 580" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <path d="M845 488 L885 488" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M877 480 L885 488 L877 496" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <!-- Step 4 -->
  <rect x="885" y="365" width="225" height="245" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text class="t" x="910" y="405" font-size="15" font-weight="700" letter-spacing="2" fill="#191919">4단계 · 공공 송전망</text>
  <text class="t" x="910" y="445" font-size="26" font-weight="700" fill="#191919">110kV 연결점</text>
  <text class="t" x="910" y="485" font-size="18" fill="#191919">고압 전력망까지</text>
  <text class="t" x="910" y="513" font-size="18" fill="#191919">1분 주기 전력 수요</text>
  <text class="t" x="910" y="541" font-size="18" fill="#191919">변동이 그대로 전파</text>
  <path d="M910 562 L945 580 L990 562 L1025 580 L1085 562" fill="none" stroke="#e34f32" stroke-width="2"/>

  <text class="t" x="1110" y="655" text-anchor="end" font-size="17" fill="#6d6d6d">개별 배터리의 작은 진단 전류가 수만 대씩 겹치면 고압 송전망의 주파수를 흔든다</text>
</svg>
