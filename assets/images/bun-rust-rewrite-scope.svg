<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Bun의 재작성에서 유지한 것과 뒤로 미룬 것을 나눈 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="90" y="90" font-size="30" font-weight="700" fill="#191919">한 번에 바꾸는 것은 하나만</text>
  <rect x="90" y="155" width="1020" height="205" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="135" y="205" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">이번 재작성</text>
  <text class="t" x="135" y="258" font-size="30" font-weight="700" fill="#191919">Zig에서 Rust로 기계적 포트</text>
  <text class="t" x="135" y="303" font-size="19" fill="#6d6d6d">같은 구조 · 같은 기능 · 같은 TypeScript 테스트</text>
  <text class="t" x="1065" y="303" text-anchor="end" font-size="19" font-weight="700" fill="#e34f32">동작 차이를 최소화</text>
  <path d="M600 360 L600 420" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M591 410 L600 422 L609 410" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="625" y="397" font-size="16" fill="#6d6d6d">출시 뒤에 이어서</text>
  <rect x="90" y="422" width="1020" height="170" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="135" y="472" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">다음 단계</text>
  <text class="t" x="135" y="525" font-size="30" font-weight="700" fill="#191919">Rust다운 구조로 리팩터링</text>
  <text class="t" x="135" y="562" font-size="19" fill="#6d6d6d">unsafe 축소 · 구조 개선 · 오래된 코드 정리</text>
  <text class="t" x="1110" y="650" text-anchor="end" font-size="17" fill="#6d6d6d">번역과 재설계를 섞지 않아 실패 원인을 좁혔다</text>
</svg>
