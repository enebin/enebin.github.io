<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="학습 데이터와 코드까지 공개한 모델, 가중치만 공개한 모델, API만 제공하는 모델을 사용 범위와 함께 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="72" y="132" font-size="15" font-weight="700" fill="#6d6d6d">사용자가</text>
  <text class="t" x="72" y="156" font-size="15" font-weight="700" fill="#6d6d6d">더 자유롭다</text>
  <path d="M92 182 L92 554" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="72" y="586" font-size="15" font-weight="700" fill="#6d6d6d">제공자의</text>
  <text class="t" x="72" y="610" font-size="15" font-weight="700" fill="#6d6d6d">제약이 크다</text>

  <rect x="180" y="90" width="900" height="140" fill="#fafafa"/>
  <text class="t" x="220" y="140" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">데이터와 코드까지</text>
  <text class="t" x="220" y="180" font-size="30" font-weight="700" fill="#191919">처음부터 다시 만들 수 있다</text>
  <text class="t" x="220" y="212" font-size="19" fill="#6d6d6d">학습 데이터, 학습 코드, 가중치가 모두 있다. 재현이 가능한 상태</text>

  <rect x="180" y="278" width="900" height="140" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="220" y="328" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">가중치만</text>
  <text class="t" x="220" y="368" font-size="30" font-weight="700" fill="#191919">고치고 다시 배포할 수 있다</text>
  <text class="t" x="220" y="400" font-size="19" fill="#6d6d6d">내 기기에서 실행하고, 미세 조정하고, 다시 배포할 수 있다. 다만 학습 과정은 알 수 없다</text>

  <rect x="180" y="466" width="900" height="140" fill="#fafafa"/>
  <text class="t" x="220" y="516" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">API만</text>
  <text class="t" x="220" y="556" font-size="30" font-weight="700" fill="#191919">보내고 받는 것만 할 수 있다</text>
  <text class="t" x="220" y="588" font-size="19" fill="#6d6d6d">모델은 외부 서버에 있다. 입력 내용이 전송되고, 가격과 이용 조건도 바뀔 수 있다</text>

  <text class="t" x="1080" y="656" text-anchor="end" font-size="17" fill="#6d6d6d">Muse Glimmer는 가운데 칸에 있다</text>
</svg>
