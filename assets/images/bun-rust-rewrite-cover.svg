<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="53만 줄의 Zig 코드를 검증 공정을 거쳐 Rust로 옮긴 Bun 재작성">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">BUN REWRITE</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">53만 줄을 옮긴 것은</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">하나의 프롬프트가 아니었다</text>
  <rect x="90" y="310" width="270" height="170" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="225" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#6d6d6d">입력</text>
  <text class="t" x="225" y="418" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">Zig</text>
  <text class="t" x="225" y="452" text-anchor="middle" font-size="18" fill="#6d6d6d">535,496줄</text>
  <path d="M360 395 L492 395" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M482 386 L494 395 L482 404" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="494" y="280" width="280" height="230" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="634" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#e34f32">검증 공정</text>
  <text class="t" x="634" y="380" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">11일</text>
  <path d="M540 410 L728 410" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="634" y="449" text-anchor="middle" font-size="18" fill="#6d6d6d">구현 · 독립 리뷰 · 테스트</text>
  <text class="t" x="634" y="480" text-anchor="middle" font-size="18" fill="#6d6d6d">최대 64개 Claude</text>
  <path d="M774 395 L906 395" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M896 386 L908 395 L896 404" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <rect x="908" y="310" width="202" height="170" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="1009" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#6d6d6d">출력</text>
  <text class="t" x="1009" y="418" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">Rust</text>
  <text class="t" x="1009" y="452" text-anchor="middle" font-size="18" fill="#6d6d6d">6개 플랫폼 통과</text>
  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">속도는 모델이 냈고, 신뢰는 공정이 만들었다</text>
</svg>
