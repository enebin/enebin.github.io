<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="에이전트의 명령 요청이 사용자 승인과 암호화 저장소를 거쳐 자식 프로세스로 전달되고 검열된 결과만 돌아오는 흐름 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="70" y="78" font-size="16" font-weight="700" fill="#6d6d6d">ka run 실행 흐름</text>

  <rect x="70" y="150" width="220" height="130" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="180" y="203" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">에이전트</text>
  <text class="t" x="180" y="238" text-anchor="middle" font-size="18" fill="#6d6d6d">명령과 비밀 이름 요청</text>

  <line x1="290" y1="215" x2="410" y2="215" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M399 206 L412 215 L399 224" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="425" y="150" width="280" height="130" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="565" y="203" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">사용자 승인</text>
  <text class="t" x="565" y="238" text-anchor="middle" font-size="18" fill="#6d6d6d">별도 콘솔에서 비밀번호 입력</text>

  <line x1="705" y1="215" x2="825" y2="215" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M814 206 L827 215 L814 224" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="840" y="150" width="290" height="130" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="985" y="203" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">자식 프로세스</text>
  <text class="t" x="985" y="238" text-anchor="middle" font-size="18" fill="#6d6d6d">환경변수로 키를 받아 실행</text>

  <rect x="425" y="360" width="280" height="110" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="565" y="405" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">암호화 볼트</text>
  <text class="t" x="565" y="440" text-anchor="middle" font-size="18" fill="#6d6d6d">승인 뒤에만 값을 해제</text>
  <line x1="705" y1="415" x2="985" y2="295" stroke="#e34f32" stroke-width="3"/>
  <path d="M969 293 L987 294 L976 309" fill="none" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="818" y="367" font-size="16" font-weight="700" fill="#e34f32">키는 이 경로로만 이동</text>

  <rect x="840" y="510" width="290" height="110" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="985" y="555" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">출력 검열</text>
  <text class="t" x="985" y="590" text-anchor="middle" font-size="18" fill="#6d6d6d">정확히 같은 비밀값을 가림</text>
  <line x1="985" y1="280" x2="985" y2="495" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M976 484 L985 497 L994 484" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <line x1="840" y1="565" x2="305" y2="565" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M316 556 L303 565 L316 574" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="420" y="548" font-size="16" fill="#6d6d6d">검열된 결과만 에이전트에 반환</text>
</svg>
