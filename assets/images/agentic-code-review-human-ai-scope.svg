<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="코드 작성자와 첫 리뷰어를 사람과 AI로 나눠 만든 네 가지 리뷰 대화 분류">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t" x="90" y="82" font-size="30" font-weight="700" fill="#191919">누가 썼고, 누가 먼저 리뷰했나</text>
  <text class="t" x="90" y="116" font-size="18" fill="#6d6d6d">Pull Request 작성자와 첫 댓글 작성자의 계정 유형을 교차했다</text>

  <text class="t" x="560" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#6d6d6d">첫 리뷰어</text>
  <text class="t" x="500" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#191919">사람</text>
  <text class="t" x="870" y="208" text-anchor="middle" font-size="19" font-weight="700" fill="#191919">AI</text>

  <text class="t" x="90" y="360" font-size="16" font-weight="700" fill="#6d6d6d">코드 작성자</text>
  <text class="t" x="220" y="306" text-anchor="middle" font-size="19" font-weight="700" fill="#191919">사람</text>
  <text class="t" x="220" y="508" text-anchor="middle" font-size="19" font-weight="700" fill="#191919">AI</text>

  <rect x="310" y="238" width="380" height="160" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="342" y="280" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">HRH</text>
  <text class="t" x="342" y="326" font-size="30" font-weight="700" fill="#191919">사람 → 사람</text>
  <text class="t" x="342" y="364" font-size="18" fill="#6d6d6d">116,874개 · 41.9%</text>

  <rect x="710" y="238" width="380" height="160" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="742" y="280" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">ARH</text>
  <text class="t" x="742" y="326" font-size="30" font-weight="700" fill="#191919">사람 → AI</text>
  <text class="t" x="742" y="364" font-size="18" fill="#6d6d6d">154,469개 · 55.4%</text>

  <rect x="310" y="420" width="380" height="160" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="342" y="462" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">HRA</text>
  <text class="t" x="342" y="508" font-size="30" font-weight="700" fill="#191919">AI → 사람</text>
  <text class="t" x="342" y="546" font-size="18" fill="#6d6d6d">6,519개 · 2.3%</text>

  <rect x="710" y="420" width="380" height="160" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="742" y="462" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">ARA</text>
  <text class="t" x="742" y="508" font-size="30" font-weight="700" fill="#191919">AI → AI</text>
  <text class="t" x="742" y="546" font-size="18" fill="#6d6d6d">928개 · 0.3%</text>

  <text class="t" x="1090" y="640" text-anchor="end" font-size="17" fill="#6d6d6d">총 278,790개 인라인 리뷰 대화</text>
</svg>
