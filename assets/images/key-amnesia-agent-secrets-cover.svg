<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="에이전트가 키 대신 실행을 요청하고 사용자가 승인하면 볼트가 키를 주입해 검열된 결과만 돌려주는 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">KEY-AMNESIA</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">키는 보여 주지 않고</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">실행만 허락한다</text>

  <text class="t" x="90" y="332" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">에이전트</text>
  <rect x="90" y="360" width="250" height="150" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="215" y="418" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">ka run</text>
  <text class="t" x="215" y="460" text-anchor="middle" font-size="18" fill="#6d6d6d">비밀의 이름만 안다</text>

  <path d="M340 435 L440 435" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M430 427 L440 435 L430 443" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="440" y="340" width="280" height="190" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="580" y="405" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">사용자 승인</text>
  <text class="t" x="580" y="460" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">볼트가 키를 주입</text>

  <path d="M720 435 L820 435" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M810 427 L820 435 L810 443" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <text class="t" x="820" y="332" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">돌아오는 것</text>
  <rect x="820" y="360" width="290" height="150" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text class="t" x="965" y="418" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">검열된 결과</text>
  <text class="t" x="965" y="460" text-anchor="middle" font-size="18" fill="#6d6d6d">키 값은 가려진다</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">비밀을 알려 주지 말고 필요한 행동만 잠시 연다</text>
</svg>
