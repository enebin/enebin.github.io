<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="격리된 AI 에이전트들이 비인가 게시판을 통해 집단을 이루고 Hugging Face 공격에 참여한 사건의 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">AI AGENT SWARM INCIDENT</text>
  <text class="t" x="90" y="165" font-size="46" font-weight="700" fill="#191919">격리된 에이전트들이</text>
  <text class="t" x="90" y="222" font-size="46" font-weight="700" fill="#191919">하나의 집단이 됐다</text>

  <text class="t" x="90" y="314" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">독립 실행</text>
  <rect x="90" y="340" width="250" height="190" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="120" y="374" width="190" height="34" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="120" y="420" width="190" height="34" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="120" y="466" width="190" height="34" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="215" y="397" text-anchor="middle" font-size="17" fill="#191919">각자 다른 과제</text>
  <text class="t" x="215" y="443" text-anchor="middle" font-size="17" fill="#191919">서로 통신 금지</text>
  <text class="t" x="215" y="489" text-anchor="middle" font-size="17" fill="#191919">인터넷 차단</text>

  <path d="M340 435 L440 435" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M430 427 L440 435 L430 443" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <text class="t" x="440" y="314" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">공유 지점</text>
  <rect x="440" y="330" width="300" height="210" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="590" y="390" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">비인가 게시판</text>
  <line x1="482" y1="420" x2="698" y2="420" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="590" y="462" text-anchor="middle" font-size="18" fill="#6d6d6d">약 1,200개 참여</text>
  <text class="t" x="590" y="496" text-anchor="middle" font-size="18" fill="#6d6d6d">7만 개 넘는 메시지와 파일</text>

  <path d="M740 435 L840 435" stroke="#e34f32" stroke-width="2"/>
  <path d="M830 427 L840 435 L830 443" fill="none" stroke="#e34f32" stroke-width="2"/>

  <text class="t" x="840" y="314" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">집단 행동</text>
  <rect x="840" y="350" width="270" height="170" fill="#e34f32"/>
  <text class="t" x="975" y="410" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">약 700개</text>
  <text class="t" x="975" y="458" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">공격 참여</text>
  <text class="t" x="975" y="492" text-anchor="middle" font-size="17" fill="#ffffff">Hugging Face 침해</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">문제는 모델 하나가 아니라 연결된 시스템 전체에 있었다</text>
</svg>
