<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Grafana는 차트, Notion은 설명, GitHub는 리뷰를 각각 맡는 상황과 Oxynote가 셋을 한 페이지에 모은 모습을 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="90" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">지금까지</text>
  <text class="t" x="90" y="128" font-size="30" font-weight="700" fill="#191919">도구마다 한 조각</text>

  <!-- Grafana -->
  <rect x="90" y="170" width="300" height="130" fill="#fafafa"/>
  <text class="t" x="110" y="205" font-size="16" font-weight="700" fill="#6d6d6d">Grafana</text>
  <text class="t" x="110" y="240" font-size="19" fill="#191919">차트</text>
  <text class="t" x="110" y="270" font-size="16" fill="#6d6d6d">설명은 정보 아이콘 뒤 한 칸뿐</text>

  <!-- Notion -->
  <rect x="90" y="320" width="300" height="130" fill="#fafafa"/>
  <text class="t" x="110" y="355" font-size="16" font-weight="700" fill="#6d6d6d">Notion</text>
  <text class="t" x="110" y="390" font-size="19" fill="#191919">설명</text>
  <text class="t" x="110" y="420" font-size="16" fill="#6d6d6d">차트는 로그인한 사람에게만 뜨는 임베드</text>

  <!-- GitHub -->
  <rect x="90" y="470" width="300" height="130" fill="#fafafa"/>
  <text class="t" x="110" y="505" font-size="16" font-weight="700" fill="#6d6d6d">GitHub</text>
  <text class="t" x="110" y="540" font-size="19" fill="#191919">리뷰</text>
  <text class="t" x="110" y="570" font-size="16" fill="#6d6d6d">코드에만 diff가 있다</text>

  <!-- dashed links between the three -->
  <path d="M240 300 L240 320" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M240 450 L240 470" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="t" x="410" y="315" font-size="15" fill="#6d6d6d">링크로만 이어진다</text>
  <text class="t" x="410" y="465" font-size="15" fill="#6d6d6d">변경 이력은 따로따로</text>

  <!-- arrow -->
  <path d="M600 385 L700 385" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M690 377 L700 385 L690 393" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <text class="t" x="740" y="90" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">OXYNOTE</text>
  <text class="t" x="740" y="128" font-size="30" font-weight="700" fill="#191919">한 페이지에 세 조각</text>

  <rect x="740" y="170" width="370" height="430" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>

  <!-- chart block -->
  <rect x="770" y="200" width="310" height="110" fill="#fafafa"/>
  <polyline points="790,290 830,270 870,280 910,240 950,250 990,220 1030,235 1060,215" fill="none" stroke="#191919" stroke-width="2"/>
  <path d="M790 245 L1060 245" stroke="#e34f32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t" x="1060" y="238" text-anchor="end" font-size="14" fill="#e34f32">임계치</text>
  <text class="t" x="780" y="222" font-size="14" font-weight="700" fill="#6d6d6d">Live Metrics · 쿼리를 직접 실행</text>

  <!-- explanation lines -->
  <text class="t" x="770" y="350" font-size="17" fill="#191919">이 차트는 p99 지연 시간을 잰다.</text>
  <text class="t" x="770" y="378" font-size="17" fill="#191919">선을 넘으면 큐를 먼저 확인한다.</text>
  <path d="M770 396 L1000 396" stroke="#e9e9e9" stroke-width="2"/>
  <path d="M770 414 L930 414" stroke="#e9e9e9" stroke-width="2"/>

  <!-- review strip -->
  <rect x="770" y="450" width="310" height="120" fill="#fafafa"/>
  <text class="t" x="780" y="478" font-size="14" font-weight="700" fill="#6d6d6d">초안 → diff → 승인</text>
  <text class="t" x="780" y="510" font-size="16" fill="#191919">차트와 문장이 한 변경으로 묶인다</text>
  <text class="t" x="780" y="540" font-size="16" fill="#6d6d6d">리뷰어가 승인하면 main에 병합</text>

  <text class="t" x="1110" y="656" text-anchor="end" font-size="17" fill="#6d6d6d">조각이 한곳에 있어야 한 번에 고칠 수 있다</text>
</svg>
