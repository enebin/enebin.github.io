<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="독자가 낯선 본문 내용을 이해하는 일과 스스로 이해도를 점검하는 메타인지 과제를 동시에 떠안아 주의력이 분산되는 구조">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Header box: Reader's limited attention -->
  <rect x="180" y="60" width="840" height="100" fill="#fafafa" stroke="#191919" stroke-width="2"/>
  <text class="t" x="600" y="102" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">독자의 제한된 주의력과 작업기억</text>
  <text class="t" x="600" y="138" text-anchor="middle" font-size="28" font-weight="700" fill="#191919">낯선 책을 읽는 동안 두 가지 일을 동시에 처리해야 한다</text>

  <!-- Split arrows -->
  <path d="M420 160 L310 230" stroke="#191919" stroke-width="2"/>
  <path d="M314 218 L308 231 L322 229" fill="none" stroke="#191919" stroke-width="2"/>
  <path d="M780 160 L890 230" stroke="#e34f32" stroke-width="2"/>
  <path d="M878 229 L892 231 L886 218" fill="none" stroke="#e34f32" stroke-width="2"/>

  <!-- Left column: Object-level thinking -->
  <rect x="80" y="236" width="460" height="350" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="120" y="284" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">1차 과제 — 내용 사고</text>
  <text class="t" x="120" y="326" font-size="30" font-weight="700" fill="#191919">책의 아이디어를 따라가기</text>

  <rect x="120" y="356" width="380" height="60" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="144" y="393" font-size="18" fill="#191919">새로 등장한 전문 용어와 정의 파악</text>

  <rect x="120" y="430" width="380" height="60" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="144" y="467" font-size="18" fill="#191919">문장과 문단 사이의 논리 전개 추적</text>

  <rect x="120" y="504" width="380" height="60" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="144" y="541" font-size="18" fill="#191919">저자가 든 구체적 사례와 근거 해석</text>

  <!-- Right column: Metacognitive monitoring -->
  <rect x="660" y="236" width="460" height="350" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="700" y="284" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">2차 과제 — 메타인지 (생각에 대한 생각)</text>
  <text class="t" x="700" y="326" font-size="30" font-weight="700" fill="#191919">내 이해 과정을 스스로 감독하기</text>

  <rect x="700" y="356" width="380" height="60" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="724" y="393" font-size="18" fill="#191919">성찰 전략: 지금 어떤 질문을 던지고 요약할까?</text>

  <rect x="700" y="430" width="380" height="60" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="724" y="467" font-size="18" fill="#191919">피드백 순환: 진짜 이해했나? 다시 읽어야 하나?</text>

  <rect x="700" y="504" width="380" height="60" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="724" y="541" font-size="18" fill="#191919">자기 인지 파악: 내 사각지대와 착각은 어디인가?</text>

  <!-- Conflict indicator in the middle -->
  <path d="M540 410 L660 410" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="600" y="396" text-anchor="middle" font-size="16" font-weight="700" fill="#e34f32">주의력 경쟁</text>

  <text class="t" x="1120" y="646" text-anchor="end" font-size="17" fill="#6d6d6d">정적인 책은 두 번째 과제를 돕지 못해 초심자일수록 내용 이해까지 무너진다</text>
</svg>
