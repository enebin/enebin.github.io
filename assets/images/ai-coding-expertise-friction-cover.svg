  <text class="t" x="629" y="212" text-anchor="middle" font-size="30" font-weight="700" fill="#191919">결과 생성</text>
  <text class="t" x="629" y="250" text-anchor="middle" font-size="18" fill="#6d6d6d">코드와 테스트 통과</text>
