  <text class="t" x="988" y="216" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">완료</text>
  <text class="t" x="988" y="252" text-anchor="middle" font-size="18" fill="#ffffff">바로 보이는 진도</text>
  <rect x="868" y="410" width="240" height="120" fill="#ffffff" stroke="#191919" stroke-width="2"/>
