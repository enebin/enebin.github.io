<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="AI가 만든 빠른 결과와 개발자가 쌓는 느린 이해가 갈라지는 모습을 보여주는 표지 그림">
  <style>
