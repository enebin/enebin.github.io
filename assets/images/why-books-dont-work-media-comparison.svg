<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="일반 논픽션, 교과서, 대학 수업, 컴퓨터 튜터링 시스템이 학습의 네 가지 요소를 어디까지 지원하는지 비교한 표">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="80" y="88" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">MEDIUM COMPARISON</text>
  <text class="t" x="80" y="132" font-size="30" font-weight="700" fill="#191919">기존 학습 매체들이 채우거나 놓치는 네 가지 조건</text>

  <!-- Table Header -->
  <rect x="80" y="168" width="1040" height="60" fill="#fafafa" stroke="#191919" stroke-width="2"/>
  <text class="t" x="200" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#191919">매체 · 환경</text>
  <text class="t" x="430" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#191919">연습 과제 제공</text>
  <text class="t" x="650" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#191919">진도 계획 · 피드백</text>
  <text class="t" x="860" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#191919">사회적 관계 · 토론</text>
  <text class="t" x="1030" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#191919">정서적 울림</text>

  <!-- Row 1: Non-fiction book -->
  <rect x="80" y="228" width="1040" height="90" fill="#ffffff" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="200" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#191919">일반 논픽션 책</text>
  <text class="t" x="200" y="294" text-anchor="middle" font-size="15" fill="#6d6d6d">교양서 · 전문서</text>
  <text class="t" x="430" y="280" text-anchor="middle" font-size="18" fill="#6d6d6d">독자가 직접 만듦</text>
  <text class="t" x="650" y="280" text-anchor="middle" font-size="18" fill="#6d6d6d">독자가 혼자 점검</text>
  <text class="t" x="860" y="280" text-anchor="middle" font-size="18" fill="#6d6d6d">없음</text>
  <text class="t" x="1030" y="280" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">저자의 목소리</text>

  <!-- Row 2: Textbook -->
  <rect x="80" y="318" width="1040" height="90" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="200" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#191919">교과서 독학</text>
  <text class="t" x="200" y="384" text-anchor="middle" font-size="15" fill="#6d6d6d">설명 + 연습문제</text>
  <text class="t" x="430" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">연습문제 수록</text>
  <text class="t" x="650" y="370" text-anchor="middle" font-size="18" fill="#e34f32">선택·채점은 독자 몫</text>
  <text class="t" x="860" y="370" text-anchor="middle" font-size="18" fill="#6d6d6d">없음</text>
  <text class="t" x="1030" y="370" text-anchor="middle" font-size="18" fill="#6d6d6d">무미건조함</text>

  <!-- Row 3: Academic course -->
  <rect x="80" y="408" width="1040" height="90" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="200" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#191919">대학 강의 · 수업</text>
  <text class="t" x="200" y="474" text-anchor="middle" font-size="15" fill="#6d6d6d">강의계획서 + 상담</text>
  <text class="t" x="430" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">과제 부여</text>
  <text class="t" x="650" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">진도 관리 · 첨삭</text>
  <text class="t" x="860" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">동료 토론 · 멘토링</text>
  <text class="t" x="1030" y="460" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">강사의 열정</text>

  <!-- Row 4: Intelligent tutoring system -->
  <rect x="80" y="498" width="1040" height="90" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="200" y="538" text-anchor="middle" font-size="20" font-weight="700" fill="#191919">지능형 튜터링</text>
  <text class="t" x="200" y="564" text-anchor="middle" font-size="15" fill="#6d6d6d">컴퓨터 기반 평가</text>
  <text class="t" x="430" y="550" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">단계별 문제</text>
  <text class="t" x="650" y="550" text-anchor="middle" font-size="18" font-weight="700" fill="#191919">자동 채점 · 계획</text>
  <text class="t" x="860" y="550" text-anchor="middle" font-size="18" fill="#6d6d6d">없음</text>
  <text class="t" x="1030" y="550" text-anchor="middle" font-size="18" fill="#e34f32">작가 목소리 부재</text>

  <!-- Vertical dividers -->
  <path d="M320 168 L320 588" stroke="#e9e9e9" stroke-width="2"/>
  <path d="M540 168 L540 588" stroke="#e9e9e9" stroke-width="2"/>
  <path d="M760 168 L760 588" stroke="#e9e9e9" stroke-width="2"/>
  <path d="M950 168 L950 588" stroke="#e9e9e9" stroke-width="2"/>

  <text class="t" x="1120" y="646" text-anchor="end" font-size="17" fill="#6d6d6d">수업에 돈을 내는 이유는 교과서가 덜어주지 못한 메타인지와 사회적·정서적 힘 때문이다</text>
</svg>
