<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="단순한 UNIX V7 상태 머신과 달리 tar-codec이 첫 블록에서 UStar/pax와 GNU 계열을 잠그고 pax 툼스톤을 처리하는 중첩 상태 머신 구조를 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="60" font-size="16" font-weight="700" letter-spacing="2" fill="#6d6d6d">단순한 V7 루프에서 계열 잠금과 툼스톤 규칙을 갖춘 tar-codec 상태 머신으로</text>

  <!-- Left panel: V7 State Machine -->
  <rect x="90" y="88" width="380" height="536" fill="#fafafa"/>
  <text class="t" x="118" y="128" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">기존 · UNIX V7 상태 머신</text>
  <text class="t" x="118" y="166" font-size="28" font-weight="700" fill="#191919">단일 루프 (4개 상태)</text>

  <rect x="130" y="198" width="300" height="68" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
  <text class="t" x="150" y="228" font-size="17" font-weight="700" fill="#191919">AwaitingHeader (헤더 대기)</text>
  <text class="t" x="150" y="252" font-size="15" fill="#6d6d6d">size = 0 이면 즉시 자기 자신으로 복귀</text>

  <path d="M230 266 L230 308" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M222 300 L230 310 L238 300" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="142" y="294" font-size="15" fill="#6d6d6d">size &gt; 0</text>

  <path d="M330 310 L330 268" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M322 276 L330 266 L338 276" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="342" y="294" font-size="15" fill="#6d6d6d">블록 소진</text>

  <rect x="130" y="312" width="300" height="68" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
  <text class="t" x="150" y="342" font-size="17" font-weight="700" fill="#191919">ReadingBody (본문 읽기)</text>
  <text class="t" x="150" y="366" font-size="15" fill="#6d6d6d">ceil(size / 512) 블록 동안 헤더 판별 중지</text>

  <path d="M280 380 L280 422" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M272 414 L280 424 L288 414" fill="none" stroke="#c9c9c9" stroke-width="2"/>
  <text class="t" x="292" y="408" font-size="15" fill="#6d6d6d">헤더 대기 중 첫 0 블록</text>

  <rect x="130" y="426" width="300" height="64" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
  <text class="t" x="150" y="454" font-size="17" font-weight="700" fill="#191919">AwaitingSecondZero</text>
  <text class="t" x="150" y="476" font-size="15" fill="#6d6d6d">두 번째 연속 0 블록이 아니면 Failed</text>

  <path d="M280 490 L280 526" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M272 518 L280 528 L288 518" fill="none" stroke="#c9c9c9" stroke-width="2"/>

  <rect x="130" y="530" width="300" height="62" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.5"/>
  <text class="t" x="150" y="558" font-size="17" font-weight="700" fill="#191919">Complete (파싱 종료)</text>
  <text class="t" x="150" y="580" font-size="15" fill="#6d6d6d">1,024바이트 NUL 확인 후 정상 완료</text>

  <!-- Right panel: tar-codec State Machine Turducken -->
  <rect x="500" y="88" width="610" height="536" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="530" y="128" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">TAR-CODEC · 중첩 상태 머신 (STATE MACHINE TURDUCKEN)</text>
  <text class="t" x="530" y="166" font-size="28" font-weight="700" fill="#191919">첫 블록에서 방언을 잠그고 교차 혼합을 차단</text>

  <!-- Step 1: Entry classification -->
  <rect x="530" y="190" width="550" height="62" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.5"/>
  <text class="t" x="550" y="218" font-size="17" font-weight="700" fill="#191919">1. Unclassified · 첫 비제로 헤더의 magic + version 검사</text>
  <text class="t" x="550" y="240" font-size="15" fill="#6d6d6d">아카이브 전체를 단일 계열로 고정 (도중에 다른 계열 헤더가 나오면 즉시 Failed)</text>

  <path d="M665 252 L665 282" stroke="#e34f32" stroke-width="2"/>
  <path d="M657 274 L665 284 L673 274" fill="none" stroke="#e34f32" stroke-width="2"/>

  <path d="M945 252 L945 282" stroke="#c9c9c9" stroke-width="2"/>
  <path d="M937 274 L945 284 L953 274" fill="none" stroke="#c9c9c9" stroke-width="2"/>

  <!-- Sub-machine A: UStar/pax -->
  <rect x="530" y="286" width="265" height="176" fill="#fafafa" stroke="#e34f32" stroke-width="1.5"/>
  <text class="t" x="548" y="314" font-size="15" font-weight="700" fill="#e34f32">USTAR / PAX 선택됨</text>
  <text class="t" x="548" y="342" font-size="17" font-weight="700" fill="#191919">g 와 x의 복귀 상태를 분리</text>
  <text class="t" x="548" y="368" font-size="15" fill="#191919">· g 본문 끝 → AwaitingHeader</text>
  <text class="t" x="548" y="392" font-size="15" fill="#191919">· x 본문 끝 → AwaitingUstarHeader</text>
  <text class="t" x="548" y="420" font-size="15" fill="#6d6d6d">지역 헤더(x) 뒤에는 반드시 일반</text>
  <text class="t" x="548" y="442" font-size="15" fill="#6d6d6d">UStar 멤버가 와야 하며 x·g 중복 금지</text>

  <!-- Sub-machine B: GNU -->
  <rect x="815" y="286" width="265" height="176" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.5"/>
  <text class="t" x="833" y="314" font-size="15" font-weight="700" fill="#6d6d6d">GNU 선택됨</text>
  <text class="t" x="833" y="342" font-size="17" font-weight="700" fill="#191919">L · K 중첩 횟수를 1회로 제한</text>
  <text class="t" x="833" y="368" font-size="15" fill="#191919">· L 또는 K (size &gt; 0 필수) 읽기</text>
  <text class="t" x="833" y="392" font-size="15" fill="#191919">· AwaitingGnuMember로 전이</text>
  <text class="t" x="833" y="420" font-size="15" fill="#6d6d6d">엔트리당 L 1개·K 1개만 허용하고</text>
  <text class="t" x="833" y="442" font-size="15" fill="#6d6d6d">동일 확장 반복 시 즉시 Failed</text>

  <!-- Bottom box: 3-state pax record resolution -->
  <rect x="530" y="482" width="550" height="118" fill="#ffffff" stroke="#e34f32" stroke-width="1.5"/>
  <text class="t" x="550" y="510" font-size="15" font-weight="700" fill="#e34f32">PAX 레코드 3단 상태 합성 (UNDECLARED · ACTIVE · TOMBSTONED)</text>
  <text class="t" x="550" y="538" font-size="16" font-weight="700" fill="#191919">빈 값 레코드("8 path=\n")는 UStar 폴백이 아니라 필드 자체를 삭제(Tombstone)</text>
  <text class="t" x="550" y="564" font-size="15" fill="#6d6d6d">· Undeclared: UStar 헤더 값 사용  · Active("12 path=abc\n"): 새 값으로 덮어씀</text>
  <text class="t" x="550" y="586" font-size="15" fill="#6d6d6d">· Tombstoned("8 path=\n"): 경로 없는 파일이 되므로 tar-codec이 즉시 거부</text>

  <text class="t" x="1110" y="664" text-anchor="end" font-size="17" fill="#6d6d6d">GNU L 뒤에 pax x가 오는 식의 모호한 조합을 상태 전이 수준에서 원천 차단한다</text>
</svg>
