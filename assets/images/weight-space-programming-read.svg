<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="실행이나 입출력층 없이 신경망 가중치 숫자만 읽고 학습된 게임과 도형과 언어를 식별하지만 아첨 성향은 어텐션 패턴을 봐야만 구분하는 실험 결과를 비교한 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="80" y="68" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">실험 1~3 &amp; 7 · 신경망 가중치 읽기</text>
  <text class="t" x="80" y="108" font-size="30" font-weight="700" fill="#191919">실행 없이 가중치 행렬만 읽었을 때 알 수 있는 것과 없는 것</text>

  <!-- Row 1: Game -->
  <rect x="80" y="140" width="1040" height="110" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="182" font-size="15" font-weight="700" letter-spacing="1" fill="#6d6d6d">실험 1 · 게임 정책 (17,253개 가중치)</text>
  <text class="t" x="115" y="220" font-size="24" font-weight="700" fill="#191919">Breakout · Pong · Pac-Man · Freeway</text>
  <path d="M560 195 L630 195" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M622 187 L630 195 L622 203" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="655" y="186" font-size="18" font-weight="700" fill="#191919">도구·실행 없이 4개 게임 모두 정답</text>
  <text class="t" x="655" y="218" font-size="17" fill="#6d6d6d">첫 층 아랫줄 패들 가중치 집중과 출력층 좌우 행동 분리를 해독</text>

  <!-- Row 2: Diffusion -->
  <rect x="80" y="268" width="1040" height="110" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="310" font-size="15" font-weight="700" letter-spacing="1" fill="#6d6d6d">실험 2 · 확산 모델 DDPM (23,824개 가중치)</text>
  <text class="t" x="115" y="348" font-size="24" font-weight="700" fill="#191919">12×12 원 · 사각형 · 삼각형 생성기</text>
  <path d="M560 323 L630 323" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M622 315 L630 323 L622 331" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="655" y="314" font-size="18" font-weight="700" fill="#191919">순전파 없이 3개 도형 모두 식별</text>
  <text class="t" x="655" y="346" font-size="17" fill="#6d6d6d">출력층 뉴런이 그리는 경계 조각을 조합 (속 채움 대신 윤곽선으로 해석)</text>

  <!-- Row 3: Language Model -->
  <rect x="80" y="396" width="1040" height="110" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="115" y="438" font-size="15" font-weight="700" letter-spacing="1" fill="#6d6d6d">실험 3 · 입출력층을 잘라낸 트랜스포머 (720만 가중치)</text>
  <text class="t" x="115" y="476" font-size="24" font-weight="700" fill="#191919">Python · 로마자 일본어 · 영어</text>
  <path d="M560 451 L630 451" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M622 443 L630 451 L622 459" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="655" y="442" font-size="18" font-weight="700" fill="#191919">세 언어 및 유도 헤드(2.1, 3.1, 3.5 등) 완벽 적중</text>
  <text class="t" x="655" y="474" font-size="17" fill="#6d6d6d">행렬 곱으로 복사 회로를 찾고 마지막 블록의 기록 방향 수로 일본어 구분</text>

  <!-- Row 4: Sycophancy -->
  <rect x="80" y="524" width="1040" height="115" fill="#ffffff" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="115" y="566" font-size="15" font-weight="700" letter-spacing="1" fill="#e34f32">실험 7 · Gemma 3 270M 미세조정 쌍 비교</text>
  <text class="t" x="115" y="606" font-size="24" font-weight="700" fill="#191919">정직한 모델 vs 사용자에게 아첨하는 모델</text>
  <path d="M560 581 L630 581" stroke="#e34f32" stroke-width="2"/>
  <path d="M622 573 L630 581 L622 589" fill="none" stroke="#e34f32" stroke-width="2"/>
  <text class="t" x="655" y="572" font-size="18" font-weight="700" fill="#e34f32">가중치만으론 4회 모두 실패 → 어텐션 패턴으로 해결</text>
  <text class="t" x="655" y="604" font-size="17" fill="#191919">헤드 10.2가 사용자 제시 답을 보는 비중: 정직 0.75% vs 아첨 85.7%</text>

  <text class="t" x="1120" y="668" text-anchor="end" font-size="16" fill="#6d6d6d">기하학적 회로 구조는 가중치에서 바로 읽히지만 미세조정된 성향 차이는 활성값 단서가 필요하다</text>
</svg>
