<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="장애가 났을 때 Litestream은 S3에서 복원하는 동안 서비스가 멈추고 rqlite는 리더 재선출 뒤 바로 이어지는 것을 비교한 시간 축 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <path d="M520 90 L520 600" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="520" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#e34f32">머신 장애</text>

  <!-- Litestream -->
  <text class="t" x="100" y="160" font-size="30" font-weight="700" fill="#191919">Litestream</text>
  <text class="t" x="100" y="192" font-size="18" fill="#6d6d6d">"머신이 죽으면 어떡하지?"</text>
  <rect x="100" y="230" width="410" height="28" fill="#191919"/>
  <rect x="530" y="230" width="270" height="28" fill="#ffffff" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="810" y="230" width="290" height="28" fill="#191919"/>
  <text class="t" x="100" y="290" font-size="17" fill="#6d6d6d">서버 1대 · WAL을 S3로 계속 전송</text>
  <text class="t" x="665" y="290" text-anchor="middle" font-size="17" fill="#191919">새 서버가 S3에서 복원</text>
  <text class="t" x="665" y="314" text-anchor="middle" font-size="17" fill="#6d6d6d">이 동안 서비스 멈춤</text>
  <text class="t" x="1100" y="290" text-anchor="end" font-size="17" fill="#6d6d6d">다시 서비스</text>

  <!-- rqlite -->
  <text class="t" x="100" y="420" font-size="30" font-weight="700" fill="#191919">rqlite</text>
  <text class="t" x="100" y="452" font-size="18" fill="#6d6d6d">"복원을 기다릴 수 없으면 어떡하지?"</text>
  <rect x="100" y="490" width="410" height="28" fill="#191919"/>
  <rect x="530" y="490" width="30" height="28" fill="#ffffff" stroke="#c9c9c9" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="570" y="490" width="530" height="28" fill="#e34f32"/>
  <text class="t" x="100" y="550" font-size="17" fill="#6d6d6d">노드 여러 대 · 쓰기마다 과반 승인</text>
  <text class="t" x="580" y="550" font-size="17" fill="#191919">남은 노드 중 새 리더를 뽑고 바로 이어서 서비스</text>

  <path d="M100 640 L1090 640" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M1080 632 L1092 640 L1080 648" fill="none" stroke="#6d6d6d" stroke-width="2"/>
  <text class="t" x="1100" y="670" text-anchor="end" font-size="16" fill="#6d6d6d">시간</text>
</svg>
