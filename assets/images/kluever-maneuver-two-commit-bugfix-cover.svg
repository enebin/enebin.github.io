<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="첫 번째 커밋에서 잘못된 현재 동작을 통과 테스트로 기록하고 두 번째 커밋에서 구현과 테스트 기대값을 함께 수정하는 Kluever Maneuver 표지 그림">
  <style>
    .t { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Helvetica,Arial,sans-serif; }
  </style>
  <rect width="1200" height="700" fill="#ffffff"/>

  <text class="t" x="90" y="100" font-size="16" font-weight="700" letter-spacing="2" fill="#e34f32">KLUEVER MANEUVER × TWO COMMITS</text>
  <text class="t" x="90" y="165" font-size="44" font-weight="700" fill="#191919">assert add(2, 2) == 5를 통과시켜야</text>
  <text class="t" x="90" y="222" font-size="44" font-weight="700" fill="#191919">버그를 고칠 수 있는 Kluever Maneuver</text>

  <rect x="90" y="330" width="460" height="190" fill="#fafafa" stroke="#e9e9e9" stroke-width="2"/>
  <text class="t" x="320" y="382" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#6d6d6d">COMMIT 1 · 버그 동작 박제 (CI 통과)</text>
  <text class="t" x="320" y="438" text-anchor="middle" font-size="28" font-weight="700" fill="#191919">assert add(2, 2) == 5</text>
  <text class="t" x="320" y="482" text-anchor="middle" font-size="18" fill="#6d6d6d">고장 난 현재 출력을 그대로 통과 테스트로 기록</text>

  <path d="M550 425 L650 425" stroke="#6d6d6d" stroke-width="2"/>
  <path d="M640 417 L650 425 L640 433" fill="none" stroke="#6d6d6d" stroke-width="2"/>

  <rect x="650" y="330" width="460" height="190" fill="#ffffff" stroke="#e34f32" stroke-width="3"/>
  <text class="t" x="880" y="382" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="#e34f32">COMMIT 2 · 구현 수정 + 기대값 반전 (CI 통과)</text>
  <text class="t" x="880" y="438" text-anchor="middle" font-size="28" font-weight="700" fill="#191919">assert add(2, 2) == 4</text>
  <text class="t" x="880" y="482" text-anchor="middle" font-size="18" fill="#6d6d6d">return a + b 수정과 기대값 변화를 한 diff로 증명</text>

  <text class="t" x="1110" y="620" text-anchor="end" font-size="17" fill="#6d6d6d">FIXME: bug #1729 → fixes: #1729</text>
</svg>
